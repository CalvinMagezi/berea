name: berea
description: "Offline Bible study agent with strict scriptural grounding."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  berea_harness:
    path: packages/harness
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_edge_ai: ^2.1.3
  flutter_edge_ai_litertlm: ^1.11.3
  sqlite3: ^2.9.4
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  http: ^1.6.0
  record: ^7.1.2
  pdfium_flutter: ^0.3.1
  ffi: ^2.2.0
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  clock: ^1.1.3
  integration_test:
    sdk: flutter

flutter:
  # CocoaPods only: SPM debug builds embed an absolute host rpath that the iOS simulator cannot
  # open from a privacy-protected folder such as ~/Documents.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/berea.sqlite
    - assets/berea.sqlite.version
    - assets/prayers.json
    - prompts/system.md
    - licenses/pdfium/
    - licenses/gemma/
