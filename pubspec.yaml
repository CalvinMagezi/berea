name: berea
description: "Offline Bible study agent with strict scriptural grounding."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  berea_harness:
    path: packages/harness
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_edge_ai: ^2.1.3
  flutter_edge_ai_litertlm: ^1.11.3
  sqlite3: ^2.9.4
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # CocoaPods only: SPM debug builds embed an absolute host rpath that the iOS simulator cannot
  # open from a privacy-protected folder such as ~/Documents.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/berea.sqlite
    - prompts/system.md
