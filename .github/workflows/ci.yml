name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
        working-directory: packages/harness
      # Berea writes nothing and runs no model; see tool/guard_no_model.sh.
      - run: bash tool/guard_no_model.sh
      - run: python3 tool/guard_strings.py
      - run: python3 tool/guard_scripture_type.py
      - run: dart analyze --fatal-infos
        working-directory: packages/harness
      - run: dart run bin/build_bsb_only_db.dart --out ../../assets/berea.sqlite
        working-directory: packages/harness
      - run: dart test
        working-directory: packages/harness

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
        working-directory: packages/harness
      - run: dart run bin/build_bsb_only_db.dart --out ../../assets/berea.sqlite
        working-directory: packages/harness
      - run: flutter pub get
      # PDFium checked by SHA-256 before pdfium_dart's hook would download it unchecked.
      - run: bash tool/pin_pdfium.sh linux-x64
      - run: flutter analyze --fatal-infos
      - run: flutter test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - run: mkdir -p assets && touch assets/berea.sqlite && echo ci > assets/berea.sqlite.version
      - run: bash tool/pin_pdfium.sh linux-x64
      - run: flutter build linux --debug

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Pinned: Flutter 3.50 wants Gradle 9 and AGP 9, which the Android build here is not on yet
      # (TECHDEBT.md). 3.47 is the oldest this project supports.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
      - run: mkdir -p assets && touch assets/berea.sqlite && echo ci > assets/berea.sqlite.version
      - run: flutter pub get
      - run: bash tool/pin_pdfium.sh android-arm64
      # Catches a manifest or Kotlin mistake before a release does. Signed with the debug key.
      - run: flutter build apk --debug --target-platform android-arm64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: mkdir assets -Force; New-Item assets/berea.sqlite -ItemType File -Force; Set-Content assets/berea.sqlite.version ci
        shell: pwsh
      - run: bash tool/pin_pdfium.sh win-x64
        shell: bash
      - run: flutter build windows --debug

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check site/page.js && node --check site/check/check.js
      # The site's reference check must agree with the Dart harness on every fixture case.
      - run: node site/check/selftest.mjs
      - run: bash tool/build_site.sh
