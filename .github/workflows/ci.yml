name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
        working-directory: packages/harness
      - run: dart analyze --fatal-infos
        working-directory: packages/harness
      - run: dart test
        working-directory: packages/harness

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get install -y libsqlite3-dev
      # The Bible database is built, not committed; tests do not open it.
      - run: mkdir -p assets && touch assets/berea.sqlite && echo ci > assets/berea.sqlite.version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: mkdir -p assets && touch assets/berea.sqlite && echo ci > assets/berea.sqlite.version
      - run: flutter build linux --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: mkdir assets -Force; New-Item assets/berea.sqlite -ItemType File -Force; Set-Content assets/berea.sqlite.version ci
        shell: pwsh
      - run: flutter build windows --debug

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check site/page.js && node --check site/check/check.js
      # The site's reference check must agree with the Dart harness on every fixture case.
      - run: node site/check/selftest.mjs
      - run: bash tool/build_site.sh
