reviewed: false
lines:
  - ref: Psalms 18:2
    text: "Lord, You are my rock, my fortress and my deliverer. I take refuge in You."
  - ref: Romans 8:13
    text: "By Your Spirit, help me put to death the deeds of the body, so that I may live."
  - ref: Proverbs 13:3
    text: "Help me guard my mouth, Lord, and not open my lips to my own ruin."
  - ref: Isaiah 55:7
    text: "I turn from my wrong ways and thoughts and return to You. Have compassion on me and pardon me freely."
  - ref: 2 Corinthians 6:16
    text: "Living God, we are Your temple. Dwell with us and walk among us, as You said, and be our God."
  - ref: Ephesians 4:24
    text: "Help me put on the new self, created to be like You in true righteousness and holiness."
  - ref: 2 Timothy 1:7
    text: "God, You have given us a spirit of power, love and self-control, not fear. Help me live by it."
  - ref: Isaiah 30:18
    text: "Lord, You long to be gracious to me, and You are a just God. Help me wait for You."
  - ref: Matthew 16:27
    text: "Lord Jesus, You will come in Your Father's glory and repay each one for their deeds. Keep me faithful."
  - ref: Malachi 4:2
    text: "Teach me to fear Your name, Lord, and let the sun of righteousness rise on me with healing."
  - ref: Luke 12:31
    text: "Help me seek Your kingdom, and trust Your word that the things I need will be added."
  - ref: Hebrews 5:7
    text: "Thank You that You heard Jesus when He prayed with loud cries and tears. Teach me reverence."
  - ref: Psalms 29:11
    text: "Lord, You give Your people strength and bless them with peace. Give me that strength and peace today."
  - ref: Psalms 34:18
    text: "Thank You that You are near to the brokenhearted and save the contrite in spirit. Be near to me."
  - ref: John 14:26
    text: "Father, thank You for sending the Holy Spirit. Let Him teach me and remind me of everything Jesus said."
  - ref: Acts 14:22
    text: "Strengthen my soul and help me continue in the faith through the many hardships on the way to Your kingdom."
  - ref: 1 Corinthians 10:13
    text: "God, You are faithful. When I am tempted, show me the escape You provide, so I can stand."
  - ref: Isaiah 53:6
    text: "Like a sheep I have strayed, turning to my own way. Thank You for laying our sin on Him."
  - ref: Titus 3:5
    text: "Thank You for saving me by Your mercy, not by my good deeds. Renew me by the Holy Spirit."
  - ref: Proverbs 1:23
    text: "Lord, help me repent at wisdom's rebuke, and make her words known to me."
  - ref: Hebrews 9:28
    text: "Thank You that Christ was offered once to bear the sins of many. Help me wait eagerly for Him."
  - ref: Matthew 28:19
    text: "Lord Jesus, You said to go and make disciples of all nations. Show me my part in obeying."
  - ref: Acts 2:38
    text: "You call us to repent and be baptized in the name of Jesus Christ for forgiveness. Help me repent."
  - ref: Philippians 1:6
    text: "Lord, You began a good work in me. Carry it on to completion until the day of Christ Jesus."
  - ref: 1 Peter 2:11
    text: "Help me, as a foreigner and exile, to abstain from the desires of the flesh that war against my soul."
  - ref: Revelation 4:11
    text: "Lord and God, I give You glory, honor and power, for You made everything and it exists by Your will."
  - ref: Isaiah 26:3
    text: "Keep me in perfect peace, Lord. Make my mind steadfast, because I trust in You."
  - ref: Ezekiel 11:19
    text: "Give me singleness of heart and a new spirit. Replace my heart of stone with a heart of flesh."
  - ref: Proverbs 4:18
    text: "Lord, keep me on the path of the righteous, which grows brighter and brighter like the dawn."
  - ref: 1 Peter 4:8
    text: "Help us love one another deeply, for love covers a multitude of sins."
  - ref: 2 Peter 3:18
    text: "Let me grow in grace and in knowing Jesus Christ, my Lord and Savior. To Him be the glory forever."
  - ref: Genesis 18:14
    text: "Lord, is anything too difficult for You? I bring You what seems impossible, and I trust You with it."
  - ref: Isaiah 44:6
    text: "Lord, You are the first and the last, and there is no God but You. I worship You."
  - ref: Colossians 1:23
    text: "Keep me established and firm in my faith, and not moved from the hope of the gospel."
  - ref: 1 Peter 2:12
    text: "Help me live with honor, even when I am slandered, so that others see my good deeds and glorify God."
  - ref: Isaiah 28:16
    text: "Thank You for the tested, precious cornerstone You laid, a sure foundation. Let me believe and never be shaken."
  - ref: 2 Corinthians 5:7
    text: "Lord, help me walk by faith and not by sight today."
  - ref: Psalms 103:17
    text: "Your loving devotion is from everlasting to everlasting for those who fear You. Teach us to fear You."
  - ref: Jeremiah 10:23
    text: "I know my way is not my own, Lord. Direct my steps."
  - ref: Hebrews 6:18
    text: "God, You cannot lie. Strongly encourage me as I take hold of the hope set before me."
  - ref: Romans 5:1
    text: "Thank You that I am justified through faith and have peace with You through our Lord Jesus Christ."
  - ref: Micah 5:2
    text: "Thank You for the One who comes to be ruler, whose origins are of old, from the days of eternity."
  - ref: Hebrews 4:13
    text: "Nothing is hidden from You, God. Help me live honestly before You, to whom I must give account."
  - ref: 2 Timothy 4:18
    text: "Lord, rescue me from every evil action and bring me safely into Your heavenly kingdom. To You be glory forever."
  - ref: Hebrews 11:6
    text: "Give me faith to please You. I believe You exist and reward those who earnestly seek You."
  - ref: Jeremiah 31:34
    text: "I want to know You, Lord. Forgive my iniquity and remember my sins no more."
  - ref: 2 Peter 2:9
    text: "Lord, You know how to rescue the godly from trials. Make me godly, and rescue me in my trials."
  - ref: Job 28:28
    text: "Teach me to fear You, which is wisdom, and to turn from evil, which is understanding."
  - ref: Isaiah 40:8
    text: "Thank You that though the grass withers and the flowers fall, Your word stands forever. Help me trust it."
  - ref: Hebrews 13:5
    text: "Make me content with what I have, for You have said You will never leave me or forsake me."
  - ref: John 10:9
    text: "Jesus, You are the gate. I enter through You to be saved and to find pasture."
  - ref: 2 Thessalonians 3:16
    text: "Lord of peace, give me peace at all times and in every way. Be with all of us."
  - ref: Hebrews 13:6
    text: "Lord, You are my helper, so I will not be afraid of what people can do to me."
  - ref: Psalms 86:5
    text: "Lord, You are kind and forgiving, rich in loving devotion to all who call on You. I call on You."
  - ref: Titus 1:16
    text: "Lord, keep me from saying I know You while my actions deny You. Let my deeds be good."
  - ref: Luke 21:36
    text: "Lord Jesus, help me keep watch and pray at all times, and give me strength to stand before You."
  - ref: 2 Corinthians 4:18
    text: "Help me fix my eyes on what is unseen, not on what is seen, for the unseen is eternal."
  - ref: 2 Corinthians 9:8
    text: "God, You are able to make all grace abound to me. Let me abound in every good work."
  - ref: Job 23:12
    text: "Help me treasure the words of Your mouth more than my daily bread, and not depart from Your commands."
  - ref: 2 Corinthians 5:10
    text: "Lord, we must all appear before the judgment seat of Christ. Help me to live today with that in mind."
  - ref: Malachi 3:1
    text: "You said You would send a messenger to prepare the way before You. Prepare my heart to receive You."
  - ref: 2 Thessalonians 2:16
    text: "Thank You, Father and Lord Jesus Christ, for loving us by grace and giving us eternal comfort and good hope."
  - ref: Isaiah 49:23
    text: "I put my hope in You, Lord. Let me know You, and never be put to shame."
  - ref: Hebrews 12:1
    text: "Help me throw off whatever holds me back and the sin that entangles, and run my race with endurance."
  - ref: Ezekiel 39:29
    text: "Lord, do not hide Your face from us. Pour out Your Spirit on us."
  - ref: John 6:37
    text: "Jesus, I come to You. Thank You that You will never drive away the one who comes to You."
  - ref: 1 Corinthians 1:9
    text: "God, You are faithful. Thank You for calling me into fellowship with Your Son, Jesus Christ our Lord."
  - ref: Titus 2:7
    text: "Help me be an example in everything by doing good works, with integrity and dignity in my teaching."
  - ref: Proverbs 19:17
    text: "Make me kind to the poor, Lord, for kindness to the poor is a loan to You."
  - ref: Matthew 11:27
    text: "Lord Jesus, You reveal the Father to those You choose. Please reveal Him to me."
  - ref: Ephesians 1:3
    text: "Blessed be You, God and Father of our Lord Jesus Christ, for blessing us in Christ with every spiritual blessing."
  - ref: Romans 12:16
    text: "Help us live in harmony. Keep me from pride and conceit, and let me associate with the lowly."
  - ref: Isaiah 58:11
    text: "Lord, guide me always, satisfy me in a sun-scorched land, and strengthen my frame."
  - ref: John 6:63
    text: "Jesus, the Spirit gives life. Let the words You have spoken be spirit and life to me."
  - ref: 1 Corinthians 6:19
    text: "Thank You for giving me Your Holy Spirit. My body is His temple, and I am not my own."
  - ref: Hebrews 9:14
    text: "Purify my conscience from works of death by the blood of Christ, so I may serve the living God."
  - ref: Hebrews 3:14
    text: "We have come to share in Christ if we hold firmly to the end. Lord, help me hold firm."
  - ref: Deuteronomy 6:5
    text: "Help me love You, Lord my God, with all my heart, all my soul and all my strength."
  - ref: Isaiah 54:13
    text: "Lord, I pray that every child I love will be taught by You."
  - ref: Isaiah 55:11
    text: "Lord, Your word will not return to You empty. Let it accomplish what You please in me."
  - ref: 1 Samuel 16:7
    text: "Lord, You see the heart, not just the outward appearance. Make my heart right before You."
  - ref: Isaiah 49:6
    text: "Lord, bring Your salvation to the ends of the earth, and let Your light shine for the nations."
  - ref: Revelation 3:21
    text: "Jesus, help me overcome, as You overcame. You have promised the one who overcomes a seat on Your throne."
  - ref: Isaiah 1:18
    text: "Lord, I come to You, as You invite. My sins are like scarlet; make them white as snow."
  - ref: Acts 20:24
    text: "Help me finish my course and the ministry You gave me, and testify to the good news of Your grace."
  - ref: Revelation 12:11
    text: "Thank You, Jesus, for Your blood. Help me keep my testimony and stay faithful to You, whatever it costs."
  - ref: Ecclesiastes 9:10
    text: "Lord, help me do with all my might whatever my hands find to do."
  - ref: Acts 20:28
    text: "Help the shepherds of Your church keep watch over themselves and the flock, which You purchased with Your blood."
  - ref: 1 Peter 1:3
    text: "Thank You for Your great mercy, and for new birth into a living hope through the resurrection of Jesus Christ."
  - ref: 1 Peter 4:2
    text: "Help me spend the rest of my time on earth living for Your will, not for human passions."
  - ref: Isaiah 43:2
    text: "Lord, when I pass through the waters, be with me. Do not let the rivers overwhelm me."
  - ref: Matthew 7:7
    text: "Jesus, You said to ask, seek and knock. I come to You now, asking for what I need."
  - ref: Luke 21:15
    text: "Jesus, when I must answer for my faith, give me the speech and wisdom You promised Your disciples."
  - ref: Galatians 4:6
    text: "Thank You, Father, for sending the Spirit of Your Son into our hearts, crying out to You as Father."
  - ref: Hebrews 13:20
    text: "God of peace, thank You for bringing our Lord Jesus back from the dead, the great shepherd of the sheep."
  - ref: 2 Chronicles 20:17
    text: "Help me stand firm and see Your salvation. Keep me from fear and discouragement, and be with me."
  - ref: Ephesians 1:4
    text: "Thank You for choosing us in Christ before the world began, to be holy and blameless in Your presence."
  - ref: Philippians 3:21
    text: "Thank You, Lord Jesus, that You will transform our lowly bodies to be like Your glorious body."
  - ref: Jeremiah 5:21
    text: "Lord, open my eyes to see and my ears to hear, and keep me from being foolish and senseless."
  - ref: Leviticus 19:18
    text: "Lord, keep me from revenge and from holding a grudge. Help me love my neighbor as myself."
  - ref: Romans 10:11
    text: "I believe in You, Jesus. Thank You that anyone who believes in You will never be put to shame."
  - ref: Proverbs 19:21
    text: "Lord, I have many plans, but Your purpose will prevail. Let my heart rest in that."
  - ref: Hebrews 3:6
    text: "Thank You that Christ is faithful over Your house. Help us hold firmly to our confidence and our hope."
  - ref: Isaiah 32:2
    text: "Lord, make me like a shelter from the wind and a refuge from the storm for those in need."
  - ref: Isaiah 25:9
    text: "Lord, we have waited for You. Help us rejoice and be glad in Your salvation."
  - ref: Philippians 1:27
    text: "Help us live worthy of the gospel of Christ, standing firm in one spirit and contending together for the faith."
  - ref: Proverbs 16:3
    text: "Lord, today I commit all my works to You. Help me trust You with my plans."
  - ref: Jeremiah 33:6
    text: "Bring health and healing, Lord, and reveal to us the abundance of peace and truth."
  - ref: Luke 1:37
    text: "No word from You will ever fail, God. Help me trust every word You have spoken."
  - ref: Acts 1:8
    text: "Holy Spirit, give me power to be a witness for Jesus here and to the ends of the earth."
  - ref: 2 Corinthians 3:3
    text: "Write on my heart by the Spirit of the living God, and make my life a letter from Christ."
  - ref: Zechariah 10:12
    text: "Strengthen me in You, Lord, and let me walk in Your name."
  - ref: Revelation 22:1
    text: "Thank You for the river of the water of life, clear as crystal, flowing from the throne of God."
  - ref: Psalms 63:8
    text: "My soul clings to You, Lord. Uphold me with Your right hand."
  - ref: Matthew 6:24
    text: "Lord, I cannot serve both You and money. Help me serve You alone."
  - ref: 2 Corinthians 8:9
    text: "Thank You, Lord Jesus, for Your grace: though You were rich, for my sake You became poor."
  - ref: Isaiah 45:24
    text: "Lord, in You alone are righteousness and strength. I come to You for both."
  - ref: Matthew 10:22
    text: "Jesus, help me persevere to the end, even when I am hated because of Your name."
  - ref: Deuteronomy 8:3
    text: "Teach me that I do not live on bread alone, but on every word from Your mouth."
  - ref: Isaiah 54:17
    text: "Lord, I am Your servant, and my vindication is from You. Let no weapon formed against me prosper."
  - ref: Luke 4:18
    text: "Jesus, thank You for good news to the poor, freedom to captives and sight to the blind."
  - ref: 1 Peter 1:13
    text: "Help me be sober-minded and set my hope fully on the grace to be given when Jesus Christ is revealed."
