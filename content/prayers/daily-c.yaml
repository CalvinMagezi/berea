reviewed: false
lines:
  - ref: Isaiah 41:10
    text: "Help me not to fear, for You are with me. Strengthen me, help me and uphold me."
  - ref: Romans 8:31
    text: "Thank You, God, that You are for us. Help me remember this when I feel opposed."
  - ref: Philippians 4:13
    text: "Thank You, Christ, that You give me strength. Help me to do all things through You."
  - ref: John 15:7
    text: "Jesus, help me to remain in You, and let Your words remain in me as I ask."
  - ref: Joshua 1:9
    text: "Make me strong and courageous, Lord. Keep me from fear and discouragement, and be with me wherever I go."
  - ref: 1 Peter 5:10
    text: "God of all grace, You called me to Your eternal glory in Christ. After suffering, restore and strengthen me."
  - ref: James 1:12
    text: "Help me persevere under trial. Keep me loving You, for You promised the crown of life to those who do."
  - ref: 2 Corinthians 5:17
    text: "Lord, make me live as one who is in Christ, a new creation. Thank You that the new has come."
  - ref: 2 Timothy 1:9
    text: "Thank You for saving me and calling me to a holy calling, not by my works but by Your grace."
  - ref: Jeremiah 1:5
    text: "Lord, You knew and set apart Your prophet before he was born. Show me how I can serve You."
  - ref: Ephesians 6:10
    text: "Lord, be my strength today. Help me to be strong in You and in Your mighty power."
  - ref: John 1:14
    text: "Jesus, You are the Word who became flesh and lived among us, full of grace and truth. I praise You."
  - ref: 1 Peter 2:9
    text: "Thank You for calling me out of darkness into Your marvelous light. Help me to declare how excellent You are."
  - ref: Philippians 4:6
    text: "Teach me to be anxious for nothing, and in everything to bring my requests to You with thanks."
  - ref: Matthew 6:33
    text: "Help me to seek Your kingdom and Your righteousness first, and to trust You for what I need."
  - ref: John 3:36
    text: "Father, I believe in Your Son. Thank You that whoever believes in the Son has eternal life."
  - ref: Titus 2:14
    text: "Jesus, thank You for giving Yourself to redeem us from all lawlessness. Make me zealous for good deeds."
  - ref: Psalms 37:5
    text: "Lord, I commit my way to You and trust You to act."
  - ref: Isaiah 12:2
    text: "Lord, You are my salvation, my strength and my song. Help me to trust You and not be afraid."
  - ref: Galatians 5:22
    text: "Holy Spirit, grow in me love, joy, peace, patience, kindness, goodness and faithfulness."
  - ref: John 15:16
    text: "Jesus, You chose and appointed Your disciples. Help me also to go and bear fruit that will remain."
  - ref: John 8:12
    text: "Jesus, You are the light of the world. Help me follow You and have the light of life."
  - ref: John 16:33
    text: "Give me peace in You, Jesus. Trouble will come, so help me take courage, for You have overcome the world."
  - ref: Romans 8:32
    text: "Father, thank You for giving up Your own Son for us all. Teach me to trust that You give freely."
  - ref: John 4:14
    text: "Jesus, I come to You to drink. Give me the water that springs up in me to eternal life."
  - ref: Romans 5:8
    text: "Thank You, God, that Christ died for me while I was still a sinner. You prove Your love for us."
  - ref: Colossians 1:11
    text: "Lord, strengthen me with all power according to Your glorious might, so that I have full endurance and patience."
  - ref: Psalms 84:11
    text: "Lord, thank You for giving grace and glory. Be my sun and my shield, and help me walk with integrity."
  - ref: Ephesians 1:11
    text: "Thank You for choosing us as Your own in Christ. I trust You, who work out everything by Your will."
  - ref: Ephesians 3:16
    text: "Father, out of the riches of Your glory, strengthen me through Your Spirit in my inner being."
  - ref: John 14:27
    text: "Thank You, Jesus, for Your peace, not as the world gives. Let my heart not be troubled or afraid."
  - ref: Joel 2:28
    text: "Lord, pour out Your Spirit on all people, on our sons and daughters, on our old and our young."
  - ref: 1 Peter 3:18
    text: "Thank You, Christ, for suffering for sins once for all, the righteous for the unrighteous, to bring me to God."
  - ref: Psalms 55:22
    text: "Lord, I cast my burden on You. Sustain me and keep me from being shaken."
  - ref: Romans 12:2
    text: "Do not let this world shape me. Renew my mind, so I can approve Your good, pleasing and perfect will."
  - ref: John 14:6
    text: "Jesus, You are the way, the truth and the life. Thank You that through You I come to the Father."
  - ref: 2 Timothy 2:19
    text: "Lord, You know those who are Yours. I call on Your name, so help me turn away from wrongdoing."
  - ref: Isaiah 57:15
    text: "High and holy God, You dwell with the humble in spirit. Restore my spirit and revive my heart."
  - ref: 1 Corinthians 15:58
    text: "Make me steadfast and immovable, always excelling in Your work, knowing my labor in You is not in vain."
  - ref: 1 John 5:20
    text: "Jesus, thank You for coming and giving us understanding to know the One who is true. We are in You."
  - ref: Matthew 21:22
    text: "Jesus, teach me to believe as I ask in prayer. Help me bring my requests to You with faith."
  - ref: 1 Peter 2:24
    text: "Jesus, thank You for bearing my sins on the tree. Help me to die to sin and live to righteousness."
  - ref: Psalms 51:10
    text: "God, I need a clean heart. Create it in me, and renew a right spirit inside me."
  - ref: Psalms 50:15
    text: "Lord, I call on You in the day of trouble. Deliver me, and let me honor You."
  - ref: Romans 8:28
    text: "Thank You that You work all things together for the good of those who love You. Keep me loving You."
  - ref: Acts 26:18
    text: "Lord, open the eyes of people so that they may turn from darkness to light and receive forgiveness of sins."
  - ref: Luke 11:28
    text: "Lord, help me to hear Your word and obey it, and to be among the blessed."
  - ref: 1 Peter 1:22
    text: "Give me genuine love for my brothers and sisters. Help me love them deeply, from a pure heart."
  - ref: Hebrews 7:25
    text: "Thank You that You save completely and always live to intercede for me. I draw near to God through You."
  - ref: Colossians 3:17
    text: "Whatever I say or do, help me do it in the name of Jesus, giving thanks to God the Father."
  - ref: Zechariah 13:9
    text: "Lord, when trials test me like fire, help me to call on Your name and say, You are my God."
  - ref: Psalms 33:11
    text: "Lord, Your counsel stands forever, and the purposes of Your heart reach all generations. I praise You."
  - ref: John 6:40
    text: "Father, I look to the Son and believe in Him. Thank You for Your will to give me eternal life."
  - ref: 1 Peter 2:5
    text: "Build us as living stones into Your spiritual house. Let our spiritual sacrifices be acceptable to You through Jesus Christ."
  - ref: 2 Corinthians 5:21
    text: "Thank You that Christ, the sinless One, was made sin for us, so in Him we might become Your righteousness."
  - ref: Revelation 7:17
    text: "Lord, be my shepherd, lead me to springs of living water, and wipe every tear from my eyes."
  - ref: Revelation 21:6
    text: "Lord, You are the beginning and the end. I am thirsty, so give me freely from the water of life."
  - ref: Colossians 3:10
    text: "Renew my new self in knowledge, Lord, in the image of the One who created it."
  - ref: Ephesians 2:10
    text: "Thank You that I am Your workmanship, created in Christ Jesus. Show me the good works You prepared in advance."
  - ref: Isaiah 61:1
    text: "Thank You for good news to the poor, for binding up the brokenhearted, and for freedom to captives and prisoners."
  - ref: Numbers 23:19
    text: "God, You are not a man that You should lie. What You say, You do. I trust Your word."
  - ref: Galatians 2:20
    text: "Thank You, Son of God, for loving me and giving Yourself for me. Let me live by faith in You."
  - ref: James 1:17
    text: "Father, every good and perfect gift comes from You, and You never change. Thank You."
  - ref: Philippians 2:13
    text: "God, work in me, so that I want and do what serves Your good purpose."
  - ref: Jeremiah 32:17
    text: "Lord, You made heaven and earth by Your great power. Nothing is too hard for You, so I trust You."
  - ref: Psalms 62:8
    text: "God, I trust in You at all times. I pour out my heart before You, for You are our refuge."
  - ref: Hebrews 1:3
    text: "Jesus, You shine with the glory of God and uphold all things by Your powerful word. I praise You."
  - ref: Psalms 40:5
    text: "Lord my God, Your wonders and Your plans for us are more than I can count. None compares to You."
  - ref: Acts 2:17
    text: "God, You said that in the last days You would pour out Your Spirit on all people. Thank You."
  - ref: 1 Corinthians 2:9
    text: "Thank You for what You have prepared for those who love You, more than eye has seen or heart imagined."
  - ref: Ephesians 5:2
    text: "Help me walk in love, as Christ loved us and gave Himself up for us."
  - ref: Proverbs 28:26
    text: "Lord, keep me from trusting in myself, and teach me to walk in wisdom."
  - ref: 2 Corinthians 4:4
    text: "Lord, open the minds of those who cannot yet see the light of the gospel of the glory of Christ."
  - ref: Jeremiah 31:33
    text: "Put Your law in my mind and write it on my heart. You are my God, and I am Yours."
  - ref: 1 Peter 5:7
    text: "Lord, I give You every worry I carry today, because You care for me."
  - ref: Hosea 6:6
    text: "Lord, You desire mercy, not sacrifice. Make me merciful, and help me know You, not only bring offerings."
  - ref: Psalms 27:14
    text: "Lord, teach me to wait patiently for You. Make me strong and courageous while I wait."
  - ref: John 3:16
    text: "Father, thank You for so loving the world that You gave Your one and only Son. I believe in Him."
  - ref: Isaiah 7:14
    text: "Lord, thank You for the sign that a virgin would be with child and give birth to a son."
  - ref: Ezekiel 36:26
    text: "Lord, give me a new heart and a new spirit, and take away my heart of stone."
  - ref: Psalms 37:3
    text: "Lord, help me trust in You and do good. Make me faithful in the place where I live."
  - ref: 2 Corinthians 4:6
    text: "God, thank You for shining in my heart, so that I know Your glory in the face of Jesus Christ."
  - ref: James 2:5
    text: "Thank You for choosing the poor to be rich in faith and to inherit the kingdom You promised."
  - ref: Luke 6:45
    text: "Lord, store good treasure in my heart, so that my mouth speaks what is good."
  - ref: 1 John 4:19
    text: "Thank You, God, that You loved us first. Help me to love because You first loved me."
  - ref: Romans 12:12
    text: "Lord, make me joyful in hope, patient in affliction and persistent in prayer."
  - ref: 1 John 1:7
    text: "Help us walk in the light, where the blood of Jesus, Your Son, cleanses us from all sin."
  - ref: Matthew 24:35
    text: "Jesus, heaven and earth will pass away, but Your words will not. Help me to trust and keep them."
  - ref: Isaiah 59:21
    text: "Lord, let Your Spirit and Your words never leave us, our children or our grandchildren, now and forever."
  - ref: Colossians 1:10
    text: "Help me please You in every way, bearing fruit in every good work and growing in the knowledge of God."
  - ref: Jude 1:24
    text: "Keep me from stumbling, for You are able, and present me unblemished in Your glorious presence with great joy."
  - ref: Colossians 3:16
    text: "Let the word of Christ dwell in me richly, and let me sing to God with gratitude in my heart."
  - ref: Matthew 28:18
    text: "Jesus, all authority in heaven and on earth has been given to You. I submit to You today."
  - ref: Matthew 28:20
    text: "Jesus, You are with us always, to the end of the age. Help me obey all that You have commanded."
  - ref: Hebrews 13:21
    text: "Equip me with every good thing to do Your will, and work in me what pleases You, through Jesus Christ."
  - ref: Psalms 46:7
    text: "Lord, thank You that You are with us and that You are our fortress. I take shelter in You."
  - ref: 1 John 3:22
    text: "Father, help me to keep Your commandments and do what pleases You, as I ask You in prayer."
  - ref: Deuteronomy 32:30
    text: "Lord, You are my rock. Do not give me up, but hold me close and keep me from defeat."
  - ref: Matthew 1:23
    text: "Thank You for the child who is called God with us. Be with me today."
  - ref: Psalms 32:8
    text: "Lord, I need direction today. Instruct me, give me counsel, and watch over me."
  - ref: Isaiah 40:31
    text: "Lord, I wait on You. Renew my strength, so that I may run without growing weary and walk without fainting."
  - ref: James 1:5
    text: "God, I need wisdom. You give generously to all and do not find fault, so I ask You now."
  - ref: Revelation 1:5
    text: "Faithful witness, Jesus Christ, thank You for loving us and for releasing us from our sins by Your blood."
  - ref: Psalms 91:15
    text: "Lord, I call to You. Answer me, be with me in trouble, and deliver me."
  - ref: Jeremiah 32:27
    text: "Lord, You are the God of all people. Help me to trust that nothing is beyond You."
  - ref: Galatians 6:9
    text: "Lord, keep me from growing weary in doing good, and help me not to give up before the harvest."
  - ref: Hebrews 12:2
    text: "Help me fix my eyes on You, Jesus, the author and perfecter of my faith, who endured the cross."
  - ref: Ephesians 3:20
    text: "God, You are able to do immeasurably more than we ask or imagine, by Your power at work in us."
  - ref: Isaiah 66:2
    text: "Lord, You made all things. Make me humble and contrite in spirit, one who trembles at Your word."
  - ref: 2 Corinthians 4:17
    text: "Lord, help me remember in my affliction that it is producing for us an eternal weight of glory beyond comparison."
  - ref: Hebrews 6:10
    text: "God, You are not unjust and will not forget love shown for Your name. Help me keep serving Your people."
  - ref: Romans 15:13
    text: "God of hope, fill me with joy and peace as I believe, to overflow with hope by the Holy Spirit."
  - ref: 1 Chronicles 28:9
    text: "Lord, help me to know You and serve You wholeheartedly with a willing mind, for You search every heart."
  - ref: Matthew 5:6
    text: "Lord, make me hunger and thirst for righteousness, and fill me as You said."
  - ref: Zechariah 12:10
    text: "Lord, pour out a spirit of grace and prayer on us, and let us look to the pierced One."
  - ref: 1 Corinthians 1:30
    text: "Thank You, God, that I am in Christ Jesus, who has become wisdom from You, my righteousness, holiness and redemption."
  - ref: Psalms 27:1
    text: "Lord, You are my light, my salvation and the stronghold of my life. Help me not to fear or dread."
  - ref: Romans 13:14
    text: "Lord Jesus, help me clothe myself with You and make no provision for the desires of the flesh."
  - ref: Jeremiah 33:3
    text: "Lord, I call to You. Answer me, and show me the great and unsearchable things I do not know."
  - ref: Revelation 13:8
    text: "Lord Jesus, Lamb who was slain, keep me from worshiping anything or anyone but You."
  - ref: Psalms 86:15
    text: "Thank You, Lord, that You are compassionate and gracious, slow to anger, and abounding in loving devotion and faithfulness."
  - ref: James 3:17
    text: "Lord, give me wisdom from above: pure, peace-loving, gentle, full of mercy and good fruit, impartial and sincere."
