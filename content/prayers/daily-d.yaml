reviewed: false
lines:
  - ref: Revelation 2:10
    text: "Lord, keep me from fear of what I may suffer. Help me be faithful, even to death."
  - ref: John 6:27
    text: "Help me not to work for food that perishes, but for food that lasts to eternal life."
  - ref: John 5:24
    text: "Jesus, I hear Your word and believe the One who sent You. Thank You for eternal life."
  - ref: Psalms 37:7
    text: "Help me be still before You and wait patiently. Keep me from fretting when people prosper in wicked schemes."
  - ref: Psalms 145:18
    text: "Thank You, Lord, that You are near to all who call on You in truth. I call on You now."
  - ref: Zechariah 9:9
    text: "I rejoice greatly in the One who comes righteous and victorious, humble and riding on a donkey."
  - ref: 1 John 4:4
    text: "God, I am Yours. Thank You that the One in me is greater than the one in the world."
  - ref: Galatians 5:6
    text: "Let my faith express itself through love, for that is what matters in Christ Jesus."
  - ref: Revelation 22:17
    text: "I hear Your call to come. I am thirsty, and I come to drink the water of life freely."
  - ref: 2 Corinthians 3:18
    text: "Lord, I want to reflect Your glory. Keep transforming me into Your image, with glory that comes from You."
  - ref: Hebrews 4:12
    text: "Lord, let Your living and active word judge the thoughts and intentions of my heart."
  - ref: Matthew 11:29
    text: "I take Your yoke and learn from You, for You are gentle and humble in heart. Give my soul rest."
  - ref: Luke 19:10
    text: "Thank You, Jesus, that You came to seek and to save the lost."
  - ref: Proverbs 21:3
    text: "Lord, teach me to do righteousness and justice, which You desire more than sacrifice."
  - ref: Jeremiah 24:7
    text: "Give me a heart to know You, Lord, and let me return to You with all my heart."
  - ref: Titus 1:2
    text: "God, You cannot lie. Thank You for the hope of eternal life You promised before time began."
  - ref: Colossians 4:6
    text: "Lord, make my speech always gracious, seasoned with salt, so that I know how to answer everyone."
  - ref: John 10:28
    text: "Jesus, You give Your sheep eternal life, and no one can snatch them from Your hand. Keep me among them."
  - ref: Isaiah 65:24
    text: "Thank You, Lord, for Your word: before they call, You will answer, and while they speak, You will hear."
  - ref: Hebrews 10:22
    text: "I draw near to You with a sincere heart and full assurance of faith. Cleanse my guilty conscience."
  - ref: 2 Corinthians 7:1
    text: "Help me cleanse myself from everything that defiles body and spirit, perfecting holiness in the fear of God."
  - ref: Ephesians 4:32
    text: "Make me kind and tenderhearted to others, forgiving them as in Christ You forgave me."
  - ref: Ephesians 6:18
    text: "Help me pray in the Spirit at all times, staying alert and persevering in prayer for all the saints."
  - ref: Isaiah 40:11
    text: "Tend me like a shepherd, Lord. Gather me in Your arms and carry me close to Your heart."
  - ref: Romans 8:2
    text: "Thank You that in Christ Jesus the Spirit of life set me free from the law of sin and death."
  - ref: Revelation 21:3
    text: "Thank You that You will dwell with us, and we will be Your people, with You as our God."
  - ref: Revelation 5:9
    text: "Worthy are You, Jesus. You were slain, and by Your blood You purchased us for God from every nation."
  - ref: 1 Peter 1:20
    text: "Thank You, God, that Christ was known before the world began, and was revealed for my sake."
  - ref: Mark 11:24
    text: "Jesus, give me faith when I pray, and help me trust You with all I ask."
  - ref: Jeremiah 17:10
    text: "Lord, You search the heart and examine the mind. Help me walk in ways that are right before You."
  - ref: Romans 14:17
    text: "Give me righteousness, peace and joy in the Holy Spirit, for Your kingdom is not about eating and drinking."
  - ref: 2 Corinthians 12:9
    text: "Lord, Your grace is enough for me. Let Your power be made perfect in my weakness."
  - ref: 1 Peter 5:8
    text: "Keep me sober-minded and alert, Lord, for the devil prowls like a roaring lion, seeking someone to devour."
  - ref: 2 Corinthians 4:16
    text: "Keep me from losing heart. Though my outer self is wasting away, renew my inner self day by day."
  - ref: Ephesians 5:8
    text: "Lord, I was once darkness but now I am light in You. Help me walk as a child of light."
  - ref: Matthew 20:28
    text: "Thank You, Jesus, that You came to serve, and to give Your life as a ransom for many."
  - ref: Ephesians 4:29
    text: "Keep unwholesome talk from my mouth. Let me say only what builds up the one in need and gives grace."
  - ref: John 14:13
    text: "Jesus, whatever I ask in Your name, let it bring glory to the Father in You."
  - ref: Ephesians 2:18
    text: "Thank You, Jesus, that through You we have access to the Father by one Spirit."
  - ref: James 4:4
    text: "Lord, keep me from friendship with the world, which is hostility toward You."
  - ref: John 1:29
    text: "Jesus, I look to You, the Lamb of God, who takes away the sin of the world."
  - ref: 1 Peter 1:14
    text: "Help me, as Your obedient child, not to conform to the passions of my former ignorance."
  - ref: 1 Peter 4:7
    text: "Lord, the end of all things is near. Make me clear-minded and sober so that I can pray."
  - ref: 1 John 3:2
    text: "Thank You that we are now Your children. We know that when Christ appears, we will be like Him."
  - ref: Hebrews 12:14
    text: "Help me pursue peace with everyone and holiness, without which no one will see the Lord."
  - ref: Hebrews 8:10
    text: "Put Your laws in my mind and write them on my heart, Lord. Be my God, and make me Yours."
  - ref: Isaiah 29:13
    text: "Lord, do not let me honor You with my lips while my heart is far from You."
  - ref: Isaiah 44:3
    text: "Pour water on the thirsty land, Lord, and pour out Your Spirit and blessing on our children and their children."
  - ref: Proverbs 18:10
    text: "Lord, teach me to run to Your name, my strong tower, and to find safety there."
  - ref: Matthew 19:26
    text: "Lord, what people cannot do is possible with You. I trust that with You all things are possible."
  - ref: Revelation 21:8
    text: "Keep me from cowardice, unbelief, idols and lies, Lord. I do not want to face the second death."
  - ref: 1 Peter 3:9
    text: "Help me not to repay evil with evil or insult with insult, but to give blessing instead."
  - ref: Deuteronomy 30:6
    text: "Circumcise our hearts and our children's hearts, Lord, so that we love You with all our heart and soul."
  - ref: Romans 8:1
    text: "Thank You, Father, that there is now no condemnation for those who are in Christ Jesus."
  - ref: Philippians 4:19
    text: "My God, I bring all my needs to You. Supply them according to Your glorious riches in Christ Jesus."
  - ref: Isaiah 44:22
    text: "Thank You for blotting out my sins like a cloud. I return to You, for You have redeemed me."
  - ref: Revelation 3:19
    text: "Lord, You rebuke and discipline those You love. Make me earnest, and help me repent."
  - ref: Psalms 119:11
    text: "Lord, help me keep Your word hidden in my heart, so that I do not sin against You."
  - ref: Matthew 15:19
    text: "Lord, out of the heart come evil thoughts, theft, false testimony and slander. Cleanse my heart."
  - ref: 1 Timothy 3:16
    text: "Jesus, I praise You: You appeared in the flesh and were taken up in glory. Great is this mystery."
  - ref: Matthew 9:13
    text: "Thank You, Jesus, that You came to call sinners. Make me merciful, for You desire mercy, not sacrifice."
  - ref: John 4:10
    text: "Jesus, help me know the gift of God and who You are. I ask You for living water."
  - ref: Matthew 25:34
    text: "Father, I thank You for the kingdom prepared from the foundation of the world for those You bless."
  - ref: Genesis 15:1
    text: "Lord, be my shield and my very great reward. Take away my fear."
  - ref: Proverbs 28:13
    text: "Lord, I will not hide my sins. I confess them and turn from them, and I ask for Your mercy."
  - ref: Isaiah 42:1
    text: "Thank You, Father, for the One You uphold, in whom You delight, who will bring justice to the nations."
  - ref: Revelation 1:8
    text: "Lord God, You are the Almighty, who is and was and is to come. I worship You."
  - ref: Joshua 1:5
    text: "Lord, be with me, and never leave me or forsake me."
  - ref: Psalms 147:3
    text: "Lord, You heal the brokenhearted and bind up their wounds. Heal my broken heart."
  - ref: John 10:14
    text: "Jesus, You are the good shepherd. Thank You that You know Your sheep. Help me to know You."
  - ref: Philippians 4:7
    text: "Let the peace of God, that goes beyond all understanding, guard my heart and my mind in Christ Jesus."
  - ref: John 12:46
    text: "Thank You, Jesus, for coming as a light. Let me not remain in darkness, for I believe in You."
  - ref: Philippians 3:9
    text: "Let me be found in Christ, not having a righteousness of my own, but the righteousness from God through faith."
  - ref: Galatians 5:24
    text: "Help me live as one who belongs to Christ Jesus and has crucified the flesh with its passions and desires."
  - ref: Psalms 46:11
    text: "Lord, You are with us, and You are our fortress. I trust in You."
  - ref: John 13:17
    text: "Jesus, help me serve others as You showed us, for You say I will be blessed if I do it."
  - ref: Acts 3:19
    text: "Lord, I repent and turn back to You, so that my sins may be wiped away."
  - ref: Psalms 100:3
    text: "Lord, You are God. You made us, and we are Yours, Your people and the sheep of Your pasture."
  - ref: Proverbs 21:30
    text: "Lord, I praise You, for no wisdom, understanding or counsel can prevail against You."
  - ref: 1 Peter 1:8
    text: "Jesus, I have not seen You, yet I love You. I believe in You and rejoice with glorious joy."
  - ref: John 17:3
    text: "Father, I want to know You, the only true God, and Jesus Christ, whom You sent. This is eternal life."
  - ref: Psalms 118:6
    text: "Lord, You are on my side, so I will not be afraid. What can people do to me?"
  - ref: Leviticus 26:8
    text: "Lord, You can make five pursue a hundred. Teach me to trust in Your strength."
  - ref: Lamentations 3:26
    text: "Lord, teach me to wait quietly for Your salvation, for it is good to wait."
  - ref: John 10:11
    text: "Thank You, Jesus, that as the good shepherd You lay down Your life for the sheep."
  - ref: Ephesians 1:7
    text: "Thank You for redemption through Christ's blood and the forgiveness of my trespasses, by the riches of Your grace."
  - ref: Isaiah 64:4
    text: "There is no God besides You, Lord, who acts for those who wait for You. I wait for You."
  - ref: Romans 8:15
    text: "Thank You, Father, that I received the Spirit of adoption, not a spirit of slavery that leads back to fear."
  - ref: 2 Thessalonians 3:3
    text: "Lord, You are faithful. Strengthen me and guard me from the evil one."
  - ref: Micah 4:12
    text: "Lord, teach me to know Your thoughts and to understand Your plan."
  - ref: 1 Corinthians 4:5
    text: "Help me judge nothing before the appointed time, but wait until You come and bring to light what is hidden."
  - ref: Revelation 11:15
    text: "Lord, I praise You: the kingdom of the world has become Yours and Your Christ's, and You will reign forever."
  - ref: Acts 4:12
    text: "Jesus, there is no other name under heaven by which we must be saved. I trust in You alone."
  - ref: Job 23:13
    text: "Lord, You do not change, and no one can oppose You. You do what You desire. I praise You."
  - ref: Acts 10:38
    text: "Thank You, God, for anointing Jesus with the Holy Spirit and power. He went about doing good and healing."
  - ref: Deuteronomy 3:22
    text: "Take my fear away, Lord my God, and fight for me Yourself."
  - ref: Galatians 5:13
    text: "You called me to freedom. Keep me from using it for the flesh, and help me serve others in love."
  - ref: Hebrews 13:8
    text: "Thank You, Jesus Christ, that You are the same yesterday and today and forever."
  - ref: Isaiah 9:6
    text: "Thank You for the child born to us, the son given to us, on whose shoulders the government will rest."
  - ref: 1 Peter 1:2
    text: "Father, set me apart by the Spirit for obedience to Jesus Christ, and give me grace and peace in abundance."
  - ref: 1 John 2:27
    text: "Lord, let the anointing I received from You remain in me and teach me, so that I remain in You."
  - ref: Romans 2:7
    text: "Give me perseverance in doing good, as I seek glory, honor and immortality. I look to You for eternal life."
  - ref: Romans 16:20
    text: "God of peace, crush the devil under our feet soon, and let the grace of our Lord be with us."
  - ref: Proverbs 16:9
    text: "Lord, my heart plans my course, but You determine my steps. Direct my steps."
  - ref: Acts 2:39
    text: "Thank You, Lord, that the promise belongs to us and our children, and to all whom You call to Yourself."
  - ref: Genesis 1:1
    text: "I praise You, God, who in the beginning created the heavens and the earth."
  - ref: Luke 18:1
    text: "Jesus, teach me to pray at all times and not to lose heart."
  - ref: Romans 12:1
    text: "Because of Your mercy, I offer my body to You as a living sacrifice, holy and pleasing to You."
  - ref: Colossians 3:12
    text: "Clothe me with compassion, kindness, humility, gentleness and patience, as one chosen, holy and loved by You."
  - ref: Galatians 3:13
    text: "Thank You, Jesus, that You redeemed us from the curse of the law by becoming a curse for us."
  - ref: Jeremiah 17:9
    text: "Lord, my heart is deceitful above all things, and I cannot understand it. Have mercy on me."
  - ref: Galatians 5:1
    text: "Christ, You have set me free. Help me stand firm and not be burdened again by a yoke of slavery."
  - ref: 1 Peter 5:5
    text: "Clothe me with humility toward others, Lord, for You oppose the proud and give grace to the humble."
  - ref: Romans 15:4
    text: "Thank You for Your word, written long ago to teach us. Through endurance and its encouragement, give me hope."
  - ref: Isaiah 43:25
    text: "Thank You that You blot out my sins for Your own sake and remember them no more."
  - ref: Isaiah 61:10
    text: "I rejoice greatly in You, Lord, for You clothe me in garments of salvation and a robe of righteousness."
  - ref: Deuteronomy 20:4
    text: "Lord my God, go with me, and give me the victory as You fight for Your people."
  - ref: Psalms 145:19
    text: "Lord, I fear You. Hear my cry and save me. I bring my desires to You."
  - ref: John 1:18
    text: "Thank You, Father, that Your one and only Son, who is Himself God, has made You known."
  - ref: Hebrews 4:16
    text: "I come with confidence to Your throne of grace. Give me mercy and grace to help in my need."
  - ref: Colossians 4:2
    text: "Lord, help me devote myself to prayer, being watchful and thankful."
  - ref: 1 Peter 3:22
    text: "Jesus, I praise You. You are at God's right hand, with angels, authorities and powers subject to You."
