# Prayer topics. Each point stands on one verse, says no more than that verse, and is 20 words or
# fewer. `words` are what people type for the topic. Set `reviewed: true` only after a person has
# read the topic; the pastors' open questions for 0.8.0 are in TECHDEBT.md. Never reorder or delete
# a point, since groups pray "point 3" together: add new points at the end.
topics:
  - id: praise
    group: Every day
    title: Praise
    words: [worship, adore, glory, honour, honor, thank, magnify]
    reviewed: true
    points:
      - text: "Bless the Lord, my soul. With all that is within me, I bless His holy name."
        ref: Psalm 103:1
      - text: "Help me not to forget any of Your kind deeds."
        ref: Psalm 103:2
      - text: "Lord, You are great and worthy of praise. Your greatness is beyond my understanding."
        ref: Psalm 145:3
      - text: "I enter Your gates with thanksgiving and Your courts with praise."
        ref: Psalm 100:4
      - text: "You are worthy, our Lord and God, to receive glory and honor and power."
        ref: Revelation 4:11
      - text: "You created all things, and by Your will they exist. I praise You."
        ref: Revelation 4:11

  - id: confession
    group: Every day
    title: Confession
    words: [sin, forgive, forgiveness, guilt, repent, sorry, wrong, cleanse]
    reviewed: true
    points:
      - text: "I confess my sins to You. You are faithful and just to forgive me."
        ref: 1 John 1:9
      - text: "Cleanse me from all unrighteousness, Lord."
        ref: 1 John 1:9
      - text: "Create in me a clean heart, God, and renew a right spirit within me."
        ref: Psalm 51:10
      - text: "I will not hide my wrong from You. I acknowledge my sin."
        ref: Psalm 32:5
      - text: "I confess my wrongdoing to You, Lord. Forgive the guilt of my sin."
        ref: Psalm 32:5
      - text: "Search me, God, and know my heart. Test me and know my concerns."
        ref: Psalm 139:23
      - text: "See if there is any offensive way in me, and lead me in the way everlasting."
        ref: Psalm 139:24

  - id: thanksgiving
    group: Every day
    title: Thanksgiving
    words: [thank, thanks, grateful, blessings, gratitude, thankful]
    reviewed: true
    points:
      - text: "I give thanks to You, Lord, for You are good. Your loving devotion endures forever."
        ref: Psalm 107:1
      - text: "Teach me to give thanks in every circumstance, for this is Your will for me."
        ref: 1 Thessalonians 5:18
      - text: "Thank You for all Your kind deeds. I will not forget them."
        ref: Psalm 103:2
      - text: "As I bring my requests to You, let me do it with thanksgiving."
        ref: Philippians 4:6
      - text: "Thank You for what You have already done, even while I wait."
        ref: Philippians 4:6
      - text: "Thank You in the hard days as well as the easy ones."
        ref: 1 Thessalonians 5:18

  - id: others
    group: Every day
    title: For others
    words: [intercession, intercede, people, friends, nation, leaders, government, gospel, missionaries, pastor]
    reviewed: true
    points:
      - text: "I pray for everyone today, with petitions, prayers, intercessions and thanks."
        ref: 1 Timothy 2:1
      - text: "Bless our leaders, so that we may lead quiet and peaceful lives in all godliness."
        ref: 1 Timothy 2:2
      - text: "Lord, I pray for those in authority over us."
        ref: 1 Timothy 2:2
      - text: "Make my town prosper. I pray to You on its behalf."
        ref: Jeremiah 29:7
      - text: "Help me seek the good of the place where You have put me."
        ref: Jeremiah 29:7
      - text: "Let my heart's desire and prayer be for the salvation of others."
        ref: Romans 10:1
      - text: "Give words to those who preach the gospel, so that they speak it boldly."
        ref: Ephesians 6:19

  - id: work
    group: Daily life
    title: Work and daily bread
    words: [job, employment, boss, office, salary, wages, daily, bread, income, career, hard work]
    reviewed: true
    points:
      - text: "Father, give us today our daily bread, and teach me to trust You for tomorrow."
        ref: Matthew 6:11
      - text: "Let Your favour rest on me, and establish the work of my hands."
        ref: Psalm 90:17
      - text: "I commit my work and my plans to You. Bring them to good ends."
        ref: Proverbs 16:3
      - text: "Help me work with my whole heart, as for You and not only for people."
        ref: Colossians 3:23
      - text: "Keep my scales honest and my dealings clean, even when no one is checking."
        ref: Proverbs 11:1
      - text: "Teach me to be content, in a month of plenty and in a month of little."
        ref: Philippians 4:11-12
      - text: "Make me skilled in my work."
        ref: Proverbs 22:29
      - text: "Help me honor You with my wealth and with the first of all I earn."
        ref: Proverbs 3:9

  - id: job-search
    group: Daily life
    title: Looking for work
    words: [unemployed, interview, vacancy, cv, hired, employer, career, apply, application, jobless]
    reviewed: true
    points:
      - text: "I ask, I seek, I knock. Open the right door for me."
        ref: Matthew 7:7
      - text: "I trust You with all my heart, and I will not lean on my own understanding."
        ref: Proverbs 3:5
      - text: "In all my ways I acknowledge You. Make my paths straight."
        ref: Proverbs 3:6
      - text: "I commit my way to You, Lord. I trust that You will do it."
        ref: Psalm 37:5
      - text: "Supply all my needs according to Your glorious riches in Christ Jesus."
        ref: Philippians 4:19
      - text: "Keep me from giving up. Help me keep asking, seeking and knocking."
        ref: Matthew 7:7
      - text: "I lack wisdom for what is in front of me. Give it to me generously."
        ref: James 1:5

  - id: business
    group: Daily life
    title: Business and trade
    words: [shop, market, customers, trader, selling, buying, profit, enterprise, boda, startup, company]
    reviewed: true
    points:
      - text: "Keep my scales honest and my dealings clean, even when no one is checking."
        ref: Proverbs 11:1
      - text: "Let my weights and measures be accurate, for that is Your delight."
        ref: Proverbs 11:1
      - text: "I commit my work to You, Lord. Establish my plans."
        ref: Proverbs 16:3
      - text: "Make me skilled in my trade, like the worker who serves in the presence of kings."
        ref: Proverbs 22:29
      - text: "Make me generous, Lord, for You tell us to give."
        ref: Luke 6:38
      - text: "Help me use a fair measure with everyone, for the measure I use is measured back to me."
        ref: Luke 6:38
      - text: "Keep me from dishonest scales, which are an abomination to You."
        ref: Proverbs 11:1

  - id: farming
    group: Daily life
    title: Farming, rain and harvest
    words: [farm, farmer, crops, garden, rain, drought, harvest, seeds, planting, animals, cattle, soil, maize, coffee, famine]
    reviewed: true
    points:
      - text: "Lord, send rain on our land in its season, the early rains and the late."
        ref: Deuteronomy 11:14
      - text: "Open the heavens, Your abundant storehouse, and bless all the work of our hands."
        ref: Deuteronomy 28:12
      - text: "Soak the furrows, soften the soil, and crown this year with Your goodness."
        ref: Psalm 65:10-11
      - text: "Give me patience while the crop grows, like the farmer who waits for the rains."
        ref: James 5:7
      - text: "Keep me from growing weary of doing good, in my fields and everywhere. Help me not to give up."
        ref: Galatians 6:9
      - text: "Help me know the state of my animals and care for them well."
        ref: Proverbs 27:23
      - text: "Thank You that seedtime and harvest will not stop while the earth remains."
        ref: Genesis 8:22

  - id: money
    group: Daily life
    title: Money and debts
    words: [debt, loan, rent, bills, school fees, poor, poverty, savings, provision, lender, cash, broke]
    reviewed: true
    points:
      - text: "Supply all my needs according to Your glorious riches in Christ Jesus."
        ref: Philippians 4:19
      - text: "Help me owe no one anything, except the debt of love."
        ref: Romans 13:8
      - text: "Keep my life free from the love of money, and make me content with what I have."
        ref: Hebrews 13:5
      - text: "Thank You that You will never leave me or forsake me."
        ref: Hebrews 13:5
      - text: "Keep falsehood and lies far from me."
        ref: Proverbs 30:8
      - text: "Give me neither poverty nor riches. Feed me with the bread that is my portion."
        ref: Proverbs 30:8
      - text: "Keep me from having so much that I forget You, or so little that I steal."
        ref: Proverbs 30:9

  - id: exams
    group: Daily life
    title: Exams and study
    words: [exam, exams, test, school, university, student, studying, learning, results, marks, class, assignment]
    reviewed: true
    points:
      - text: "I lack wisdom for my studies. You give generously to all who ask, so I ask."
        ref: James 1:5
      - text: "Lord, You give wisdom, knowledge and understanding. Give them to me for my exams."
        ref: Proverbs 2:6
      - text: "As You gave knowledge and understanding to four young men, give them to me."
        ref: Daniel 1:17
      - text: "Give me insight and understanding in every kind of study."
        ref: Daniel 1:17
      - text: "Help me study with my whole being, as for You and not only for people."
        ref: Colossians 3:23
      - text: "Guard my heart and my mind with Your peace on the day of the exam."
        ref: Philippians 4:7
      - text: "I am anxious about my exam. I bring it to You in prayer, with thanksgiving."
        ref: Philippians 4:6

  - id: justice
    group: Daily life
    title: Justice and fairness
    words: [court, case, judge, unfair, oppression, corruption, rights, injustice, police, land dispute, wronged, lawyer]
    reviewed: true
    points:
      - text: "I commit this matter to You and trust You. Bring forth my justice like the noonday sun."
        ref: Psalm 37:5-6
      - text: "Help me act justly, love mercy and walk humbly with You."
        ref: Micah 6:8
      - text: "Thank You for showing me what is good."
        ref: Micah 6:8
      - text: "Let justice be done, and let it be a joy to the righteous."
        ref: Proverbs 21:15
      - text: "Teach me to do right and to seek justice."
        ref: Isaiah 1:17
      - text: "Help me defend the fatherless and plead the case of the widow."
        ref: Isaiah 1:17
      - text: "Bring forth the justice of those who are wronged, like the noonday sun."
        ref: Psalm 37:6

  - id: healing
    group: Home and health
    title: Sickness and healing
    words: [sick, ill, illness, disease, hospital, pain, surgery, operation, recovery, health, malaria, cancer, medicine]
    reviewed: true
    points:
      - text: "Heal me, Lord, and I will be healed. Save me, and I will be saved."
        ref: Jeremiah 17:14
      - text: "You are my praise, even in sickness. I turn to You."
        ref: Jeremiah 17:14
      - text: "Sustain me on my bed of illness, and restore me from my bed of sickness."
        ref: Psalm 41:3
      - text: "Lord, sustain the one who is sick, and restore them from their bed of illness."
        ref: Psalm 41:3
      - text: "When I am sick, help me call for the elders of the church to pray over me."
        ref: James 5:14
      - text: "May the prayer offered in faith restore the one who is sick."
        ref: James 5:15
      - text: "Thank You for doctors, nurses and health workers who care for the sick."
        ref: Luke 5:31
      - text: "Lead me to the care I need, for the sick need a doctor."
        ref: Luke 5:31

  - id: child-hope
    group: Home and health
    title: Hoping for a child
    words: [pregnant, pregnancy, conceive, baby, barren, infertile, fertility, childless, expecting, miscarriage]
    reviewed: true
    points:
      - text: "Lord, hear my prayer, as You heard Isaac when he prayed for his wife."
        ref: Genesis 25:21
      - text: "Hear the prayer of every husband and wife who waits for a child."
        ref: Genesis 25:21
      - text: "I ask You for a child. Grant me what I ask, as You granted Hannah."
        ref: 1 Samuel 1:27
      - text: "You settle the barren woman in her home as a joyful mother. I ask this for my home."
        ref: Psalm 113:9
      - text: "Thank You that children are a heritage from You."
        ref: Psalm 127:3
      - text: "Teach me to see every child as Your gift and Your reward."
        ref: Psalm 127:3

  - id: children
    group: Home and health
    title: Raising children
    words: [parenting, son, daughter, teenager, kids, discipline, school, family, grandchildren, orphan, youth]
    reviewed: true
    points:
      - text: "Help me train my children in the way they should go."
        ref: Proverbs 22:6
      - text: "May my children not depart from Your way when they are old."
        ref: Proverbs 22:6
      - text: "Let Your words be upon my heart, before I teach them to my children."
        ref: Deuteronomy 6:6
      - text: "Help me talk about Your words at home, on the road, when I lie down and when I get up."
        ref: Deuteronomy 6:7
      - text: "Make me diligent in teaching Your words to my children, day by day."
        ref: Deuteronomy 6:7
      - text: "Let all my children be taught by You, Lord, and prosper."
        ref: Isaiah 54:13
      - text: "Let my children walk in the truth. I have no greater joy than that."
        ref: 3 John 1:4

  - id: marriage
    group: Home and health
    title: Marriage
    words: [husband, wife, spouse, wedding, married, love, couple, forgiveness, unity, divorce, anniversary]
    reviewed: true
    points:
      - text: "Help us bear with one another and forgive any complaint, as You forgave us."
        ref: Colossians 3:13
      - text: "Clothe us in love, which binds us together in perfect unity."
        ref: Colossians 3:14
      - text: "Teach husbands to love their wives as Christ loved the church and gave Himself for her."
        ref: Ephesians 5:25
      - text: "Make our love patient and kind, not envious, boastful or proud."
        ref: 1 Corinthians 13:4
      - text: "Keep us from rudeness and self-seeking, and from being easily angered."
        ref: 1 Corinthians 13:5
      - text: "Let our love bear all things, believe all things, hope all things and endure all things."
        ref: 1 Corinthians 13:7
      - text: "Bind us together, Lord, like a cord of three strands that is not quickly broken."
        ref: Ecclesiastes 4:12

  - id: spouse-wait
    group: Home and health
    title: Waiting for a spouse
    words: [single, courtship, boyfriend, girlfriend, fiance, engaged, marry, partner, dating, unmarried]
    reviewed: true
    points:
      - text: "Teach me to delight in You, and hear the desires of my heart."
        ref: Psalm 37:4
      - text: "I commit my way to You and trust in You."
        ref: Psalm 37:5
      - text: "You are a sun and a shield. Keep me walking with integrity while I wait."
        ref: Psalm 84:11
      - text: "I trust that You withhold no good thing from those who walk with integrity."
        ref: Psalm 84:11
      - text: "I know that a good marriage is a favor from You."
        ref: Proverbs 18:22
      - text: "I trust that a prudent wife is a gift from You, Lord."
        ref: Proverbs 19:14

  - id: home-peace
    group: Home and health
    title: Peace at home
    words: [quarrel, argument, conflict, anger, reconcile, family, relatives, tension, fighting, forgive, harmony]
    reviewed: true
    points:
      - text: "If it is possible on my part, help me live at peace with everyone."
        ref: Romans 12:18
      - text: "Give me humility, gentleness and patience, bearing with others in love."
        ref: Ephesians 4:2
      - text: "Help us keep the unity of the Spirit through the bond of peace."
        ref: Ephesians 4:3
      - text: "Help me give a gentle answer that turns away anger."
        ref: Proverbs 15:1
      - text: "Keep my tongue from harsh words that stir up anger."
        ref: Proverbs 15:1
      - text: "As for me and my house, we will serve You, Lord."
        ref: Joshua 24:15
      - text: "Let this be a house that serves the Lord."
        ref: Joshua 24:15

  - id: fear
    group: The heart
    title: Fear and worry
    words: [afraid, anxious, anxiety, worried, scared, panic, stress, nervous, troubled, terror]
    reviewed: true
    points:
      - text: "When I am afraid, I put my trust in You."
        ref: Psalm 56:3
      - text: "I cast all my anxiety on You, because You care for me."
        ref: 1 Peter 5:7
      - text: "You are with me, so I will not fear. You are my God."
        ref: Isaiah 41:10
      - text: "Strengthen me, help me, and uphold me with Your righteous right hand."
        ref: Isaiah 41:10
      - text: "Give me Your peace. You do not give as the world gives."
        ref: John 14:27
      - text: "Do not let my heart be troubled or afraid."
        ref: John 14:27
      - text: "Remind me that You care for me."
        ref: 1 Peter 5:7

  - id: grief
    group: The heart
    title: Grief
    words: [death, died, funeral, mourning, loss, bereaved, sorrow, widow, widower, tears, passed away]
    reviewed: true
    points:
      - text: "Lord, You are near to the brokenhearted. Be near to me now."
        ref: Psalm 34:18
      - text: "You say those who mourn will be comforted. Comfort me."
        ref: Matthew 5:4
      - text: "I mourn, and I come to You for comfort."
        ref: Matthew 5:4
      - text: "Father of compassion and God of all comfort, comfort me in my sorrow."
        ref: 2 Corinthians 1:3
      - text: "Comfort us in all our troubles, so that we can comfort others."
        ref: 2 Corinthians 1:4
      - text: "I look to the day when You will wipe away every tear from our eyes."
        ref: Revelation 21:4
      - text: "There will be no more death, mourning, crying or pain. Thank You for that hope."
        ref: Revelation 21:4

  - id: guidance
    group: The heart
    title: Guidance
    words: [decision, direction, choose, choice, future, path, plans, confused, unsure, calling, purpose]
    reviewed: true
    points:
      - text: "I trust in You with all my heart and do not lean on my own understanding."
        ref: Proverbs 3:5
      - text: "In all my ways I acknowledge You. Make my paths straight."
        ref: Proverbs 3:6
      - text: "Instruct me and teach me the way I should go."
        ref: Psalm 32:8
      - text: "Give me counsel and watch over me."
        ref: Psalm 32:8
      - text: "Let me hear Your voice behind me when I turn right or left: this is the way, walk in it."
        ref: Isaiah 30:21
      - text: "Let Your word be a lamp to my feet and a light to my path."
        ref: Psalm 119:105

  - id: new-start
    group: The heart
    title: New beginnings
    words: [fresh start, change, move, moving, begin, restart, past, regret, mistakes, hope, renewal, new year]
    reviewed: true
    points:
      - text: "Because of Your loving devotion I am not consumed, and Your mercies never fail."
        ref: Lamentations 3:22
      - text: "Your mercies are new every morning. Great is Your faithfulness!"
        ref: Lamentations 3:23
      - text: "Help me not to call to mind the former things."
        ref: Isaiah 43:18
      - text: "Make a way in the wilderness and streams in the desert."
        ref: Isaiah 43:19
      - text: "Thank You that in Christ I am a new creation. The old has passed away."
        ref: 2 Corinthians 5:17
      - text: "Help me forget what is behind and strain toward what is ahead."
        ref: Philippians 3:13
      - text: "I press on toward the goal of Your heavenly calling in Christ Jesus."
        ref: Philippians 3:14

  - id: protection
    group: The heart
    title: Protection
    words: [safe, safety, danger, journey, travel, accident, thieves, night, guard, shelter, refuge, sleep]
    reviewed: true
    points:
      - text: "Let me dwell in the shelter of the Most High and rest in the shadow of the Almighty."
        ref: Psalm 91:1
      - text: "You are my refuge and my fortress, my God, in whom I trust."
        ref: Psalm 91:2
      - text: "Guard me from all evil, Lord, and preserve my soul."
        ref: Psalm 121:7
      - text: "Watch over my coming and going, now and forevermore."
        ref: Psalm 121:8
      - text: "Watch over my family as they come and go."
        ref: Psalm 121:8
      - text: "I will lie down and sleep in peace, for You alone make me dwell in safety."
        ref: Psalm 4:8
      - text: "Your name is a strong tower. I run to it and am safe."
        ref: Proverbs 18:10

  - id: faith
    group: Faith
    title: Growing in faith
    words: [grow, maturity, knowing God, discipleship, spiritual, holiness, closer, deeper, devotion, trust]
    reviewed: true
    points:
      - text: "I want to know Christ and the power of His resurrection."
        ref: Philippians 3:10
      - text: "Help me grow in the grace and knowledge of our Lord and Savior Jesus Christ."
        ref: 2 Peter 3:18
      - text: "Fill me with the knowledge of Your will in all spiritual wisdom and understanding."
        ref: Colossians 1:9
      - text: "Help me walk in a manner worthy of the Lord, bearing fruit in every good work."
        ref: Colossians 1:10
      - text: "Strengthen me with power through Your Spirit in my inner being."
        ref: Ephesians 3:16
      - text: "Let Christ dwell in my heart through faith, and let me be rooted in love."
        ref: Ephesians 3:17
      - text: "Help me to know the love of Christ that surpasses knowledge."
        ref: Ephesians 3:19

  - id: standing-firm
    group: Faith
    title: Standing firm against evil
    words: [evil, devil, satan, spiritual warfare, temptation, darkness, attack, demons, oppression, armor, armour, battle]
    reviewed: true
    points:
      - text: "Make me strong in You and in Your mighty power, not in my own."
        ref: Ephesians 6:10
      - text: "Clothe me in Your full armour, so that I can stand."
        ref: Ephesians 6:11
      - text: "Remind me that my struggle is not against people, not my relatives or neighbours, but against the powers of darkness."
        ref: Ephesians 6:12
      - text: "I submit to You. Help me resist the devil, and he will flee."
        ref: James 4:7
      - text: "Thank You that the One who is in me is greater than the one who is in the world."
        ref: 1 John 4:4
      - text: "Thank You that Christ disarmed the powers and authorities and triumphed over them by the cross."
        ref: Colossians 2:15
      - text: "Help me stand against the devil's schemes."
        ref: Ephesians 6:11
      - text: "Christ made a public spectacle of the powers by the cross. I stand in His victory."
        ref: Colossians 2:15
