book: Hebrews
reviewed: true
chapters:
  1:
    - text: "Thank You that You have spoken to us by Your Son, through whom You made the universe."
      ref: Hebrews 1:2
    - text: "Thank You that the Son is the radiance of Your glory and the exact representation of Your nature."
      ref: Hebrews 1:3
    - text: "Lord, the heavens will wear out like a garment, but You remain the same, and Your years will never end."
      ref: Hebrews 1:11-12
  2:
    - text: "Help me pay closer attention to what I have heard, so that I do not drift away."
      ref: Hebrews 2:1
    - text: "Thank You that Jesus shared our humanity to free those held in slavery by fear of death."
      ref: Hebrews 2:14-15
    - text: "Jesus, You suffered when You were tempted, so You are able to help me when I am tempted."
      ref: Hebrews 2:18
  3:
    - text: "Help me set my focus on Jesus, the apostle and high priest whom we confess."
      ref: Hebrews 3:1
    - text: "Today, if I hear Your voice, do not let me harden my heart."
      ref: Hebrews 3:7-8
    - text: "Help us encourage one another daily, so that none of us is hardened by the deceitfulness of sin."
      ref: Hebrews 3:13
  4:
    - text: "Your word is living and active. Let it search the thoughts and intentions of my heart."
      ref: Hebrews 4:12
    - text: "Thank You that Jesus sympathizes with my weaknesses. He was tempted in every way I am, yet without sin."
      ref: Hebrews 4:15
    - text: "I approach the throne of grace with confidence. Give me mercy and grace to help in my time of need."
      ref: Hebrews 4:16
  5:
    - text: "Thank You that Jesus prayed with loud cries and tears, and You heard Him because of His reverence."
      ref: Hebrews 5:7
    - text: "Thank You that Jesus became the source of eternal salvation to all who obey Him."
      ref: Hebrews 5:9
    - text: "Help me grow to maturity, so that by constant use my senses are trained to distinguish good from evil."
      ref: Hebrews 5:14
  6:
    - text: "You are not unjust, God. You will not forget our work and the love we show for Your name."
      ref: Hebrews 6:10
    - text: "Keep me from being sluggish. Help me imitate those who through faith and patience inherit what has been promised."
      ref: Hebrews 6:12
    - text: "Thank You for the hope You set before me, an anchor for my soul, firm and secure."
      ref: Hebrews 6:18-19
  7:
    - text: "Thank You for a better hope, by which I draw near to You."
      ref: Hebrews 7:19
    - text: "Thank You that Jesus always lives to intercede for those who draw near to God through Him."
      ref: Hebrews 7:25
    - text: "Thank You that Jesus sacrificed for sin once for all when He offered up Himself."
      ref: Hebrews 7:27
  8:
    - text: "Thank You that Jesus is our high priest, seated at the right hand of Your throne in heaven."
      ref: Hebrews 8:1
    - text: "Put Your laws in my mind and write them on my heart. Be my God, and let me be Yours."
      ref: Hebrews 8:10
    - text: "Thank You that in the new covenant You forgive my iniquities and remember my sins no more."
      ref: Hebrews 8:12
  9:
    - text: "Thank You that Christ entered once for all by His own blood, securing eternal redemption."
      ref: Hebrews 9:12
    - text: "Purify my conscience from works of death by the blood of Christ, so that I may serve the living God."
      ref: Hebrews 9:14
    - text: "Thank You that Christ was offered once to bear the sins of many. Help me eagerly await Him."
      ref: Hebrews 9:28
  10:
    - text: "Let me draw near to You with a sincere heart, in full assurance of faith, cleansed from a guilty conscience."
      ref: Hebrews 10:22
    - text: "Help me hold resolutely to the hope I profess, for You who promised are faithful."
      ref: Hebrews 10:23
    - text: "Help us spur one another on to love and good deeds, and not neglect meeting together."
      ref: Hebrews 10:24-25
  11:
    - text: "Give me faith, the assurance of what I hope for and the certainty of what I do not see."
      ref: Hebrews 11:1
    - text: "Without faith it is impossible to please You. Help me believe You exist and reward those who earnestly seek You."
      ref: Hebrews 11:6
    - text: "Help me look forward to the city with foundations, whose architect and builder is God."
      ref: Hebrews 11:10
  12:
    - text: "Help me throw off every weight and the sin that entangles, and fix my eyes on Jesus."
      ref: Hebrews 12:1-2
    - text: "Thank You that Your discipline is for my good, so that I may share in Your holiness."
      ref: Hebrews 12:10
    - text: "Thank You for an unshakable kingdom. Help me worship You acceptably, with reverence and awe."
      ref: Hebrews 12:28
  13:
    - text: "Lord, You are my helper, so I will not be afraid. What can people do to me?"
      ref: Hebrews 13:6
    - text: "Jesus Christ, You are the same yesterday, today and forever. I trust You with today."
      ref: Hebrews 13:8
    - text: "God of peace, equip me with every good thing to do Your will, and work in me what pleases You."
      ref: Hebrews 13:20-21
