book: 2 Thessalonians
reviewed: false
chapters:
  1:
    - text: "Let our faith grow more and more, and our love for one another increase."
      ref: 2 Thessalonians 1:3
    - text: "Count us worthy of Your calling, and powerfully fulfill every good desire and work of faith in us."
      ref: 2 Thessalonians 1:11
    - text: "Let the name of our Lord Jesus be glorified in me, and me in Him, by Your grace."
      ref: 2 Thessalonians 1:12
  2:
    - text: "Thank You that You chose us from the beginning to be saved by faith in the truth."
      ref: 2 Thessalonians 2:13
    - text: "Help me stand firm and cling to the traditions Paul taught, whether by speech or by letter."
      ref: 2 Thessalonians 2:15
    - text: "Father, You loved us by grace and gave us eternal comfort and good hope. Encourage my heart and strengthen me."
      ref: 2 Thessalonians 2:16-17
  3:
    - text: "You are faithful, Lord. Strengthen me, and guard me from the evil one."
      ref: 2 Thessalonians 3:3
    - text: "Keep me from growing weary in doing good."
      ref: 2 Thessalonians 3:13
    - text: "Lord of peace, give me peace at all times and in every way."
      ref: 2 Thessalonians 3:16
