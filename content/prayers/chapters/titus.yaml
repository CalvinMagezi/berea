book: Titus
reviewed: false
chapters:
  1:
    - text: "Thank You, God, who cannot lie, that You promised eternal life before time began."
      ref: Titus 1:2
    - text: "Make me hospitable, a lover of good, self-controlled, upright, holy and disciplined."
      ref: Titus 1:8
    - text: "Help leaders hold firmly to the faithful word as it was taught, so they can encourage others by sound teaching."
      ref: Titus 1:9
  2:
    - text: "Thank You that the grace of God has appeared, bringing salvation to everyone."
      ref: Titus 2:11
    - text: "Let Your grace teach me to renounce ungodliness and worldly passions, and to live a sensible, upright and godly life."
      ref: Titus 2:12
    - text: "Jesus, You gave Yourself for us to redeem us from all lawlessness. Make us zealous for good deeds."
      ref: Titus 2:14
  3:
    - text: "Help me to malign no one, to be peaceable and gentle, and to show full consideration to everyone."
      ref: Titus 3:2
    - text: "Thank You for saving me, not by righteous deeds I had done, but by Your mercy."
      ref: Titus 3:5
    - text: "Help me, as one who believes You, take care to devote myself to good deeds."
      ref: Titus 3:8
