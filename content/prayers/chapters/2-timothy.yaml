book: 2 Timothy
reviewed: true
chapters:
  1:
    - text: "Help me fan into flame the gift of God that is in me."
      ref: 2 Timothy 1:6
    - text: "Thank You that You have not given me a spirit of fear, but of power, love and self-control."
      ref: 2 Timothy 1:7
    - text: "I know whom I have believed. I am convinced You are able to guard what I entrust to You."
      ref: 2 Timothy 1:12
  2:
    - text: "Make me strong in the grace that is in Christ Jesus."
      ref: 2 Timothy 2:1
    - text: "When I am faithless, You remain faithful, for You cannot deny Yourself."
      ref: 2 Timothy 2:13
    - text: "Help me present myself approved to You, a workman unashamed, handling the word of truth accurately."
      ref: 2 Timothy 2:15
  3:
    - text: "Lord, as You rescued Paul from all his persecutions, rescue me in my troubles."
      ref: 2 Timothy 3:11
    - text: "Help me continue in what I have learned and firmly believed, knowing from whom I learned it."
      ref: 2 Timothy 3:14
    - text: "Thank You that the Bible is God-breathed. Let it teach and correct me, and equip me for every good work."
      ref: 2 Timothy 3:16-17
  4:
    - text: "Help me fight the good fight, finish the race and keep the faith."
      ref: 2 Timothy 4:7
    - text: "Lord, stand by me and strengthen me, as You stood by Paul and strengthened him."
      ref: 2 Timothy 4:17
    - text: "Rescue me from every evil action and bring me safely into Your heavenly kingdom. Glory to You forever. Amen."
      ref: 2 Timothy 4:18
