book: 2 Corinthians
reviewed: false
chapters:
  1:
    - text: "Blessed are You, God and Father of our Lord Jesus Christ, Father of compassion and God of all comfort."
      ref: 2 Corinthians 1:3
    - text: "Teach me not to trust in myself, but in You, God, who raises the dead."
      ref: 2 Corinthians 1:9
    - text: "You delivered Paul from deadly peril. I too place my hope in You to deliver me."
      ref: 2 Corinthians 1:10
  2:
    - text: "Help me to forgive and comfort, so that no one is overwhelmed by excessive sorrow."
      ref: 2 Corinthians 2:7
    - text: "Thank You for always leading us in triumph in Christ, and spreading through us the fragrance of knowing You."
      ref: 2 Corinthians 2:14
    - text: "Keep me from selling Your word for profit. Help me speak in Christ with sincerity before You."
      ref: 2 Corinthians 2:17
  3:
    - text: "I am not competent in myself. My competence comes from You."
      ref: 2 Corinthians 3:5
    - text: "Be present in my life by Your Spirit, Lord, for where Your Spirit is, there is freedom."
      ref: 2 Corinthians 3:17
    - text: "Let me reflect Your glory with an unveiled face, and transform me into Your image."
      ref: 2 Corinthians 3:18
  4:
    - text: "I am a jar of clay holding Your treasure. Let it show that the great power is Yours, not mine."
      ref: 2 Corinthians 4:7
    - text: "Renew my inner self day by day, Lord, even as my outer self wastes away. Keep me from losing heart."
      ref: 2 Corinthians 4:16
    - text: "Help me fix my eyes not on what is seen, but on what is unseen and eternal."
      ref: 2 Corinthians 4:18
  5:
    - text: "Help me walk by faith and not by sight."
      ref: 2 Corinthians 5:7
    - text: "Help me live no longer for myself, but for Him who died for me and was raised again."
      ref: 2 Corinthians 5:15
    - text: "Thank You that Christ, who knew no sin, became sin for us, that in Him we might become Your righteousness."
      ref: 2 Corinthians 5:21
  6:
    - text: "Help me not to receive Your grace in vain."
      ref: 2 Corinthians 6:1
    - text: "Thank You that now is the time of Your favor, and now is the day of salvation."
      ref: 2 Corinthians 6:2
    - text: "Thank You for promising to be our Father, with us as Your sons and daughters."
      ref: 2 Corinthians 6:18
  7:
    - text: "Help me cleanse myself from everything that defiles body and spirit, and perfect holiness in the fear of God."
      ref: 2 Corinthians 7:1
    - text: "God, You comfort the downcast. Comfort me when my spirit is low."
      ref: 2 Corinthians 7:6
    - text: "Give me godly sorrow, which brings repentance that leads to salvation without regret."
      ref: 2 Corinthians 7:10
  8:
    - text: "Thank You for the grace of our Lord Jesus Christ, who was rich yet became poor for our sake."
      ref: 2 Corinthians 8:9
    - text: "Make me eager to give, for a gift given eagerly is acceptable according to what one has."
      ref: 2 Corinthians 8:12
    - text: "Help me do what is right, not only in Your eyes, but also in the eyes of others."
      ref: 2 Corinthians 8:21
  9:
    - text: "Help me give what I have decided in my heart, not with regret or pressure, but as a cheerful giver."
      ref: 2 Corinthians 9:7
    - text: "Make all grace abound to me, so that having all I need, I may abound in every good work."
      ref: 2 Corinthians 9:8
    - text: "Thank You, God, for Your indescribable gift."
      ref: 2 Corinthians 9:15
  10:
    - text: "Help me take every thought captive and make it obedient to Christ."
      ref: 2 Corinthians 10:5
    - text: "If I boast, let me boast in You, Lord."
      ref: 2 Corinthians 10:17
    - text: "Keep me from commending myself. May I be commended by You, Lord."
      ref: 2 Corinthians 10:18
  11:
    - text: "Keep my mind from being led astray from simple and pure devotion to Christ."
      ref: 2 Corinthians 11:3
    - text: "God and Father of the Lord Jesus, You are forever worthy of praise."
      ref: 2 Corinthians 11:31
  12:
    - text: "Your grace is enough for me, Lord, and Your power is made perfect in weakness."
      ref: 2 Corinthians 12:9
    - text: "Teach me to see that when I am weak, then I am strong."
      ref: 2 Corinthians 12:10
  13:
    - text: "Help me examine myself, to see whether I am in the faith."
      ref: 2 Corinthians 13:5
    - text: "Help us rejoice, encourage one another, be of one mind and live in peace."
      ref: 2 Corinthians 13:11
    - text: "May the grace of the Lord Jesus Christ, the love of God, and the Holy Spirit's fellowship be with us."
      ref: 2 Corinthians 13:14
