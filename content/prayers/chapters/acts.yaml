book: Acts
reviewed: true
chapters:
  1:
    - text: "Let the Holy Spirit come upon me with power, and make me Your witness to the ends of the earth."
      ref: Acts 1:8
    - text: "Keep us together with one accord, continuing in prayer, as those first believers did."
      ref: Acts 1:14
    - text: "Lord, You know every heart. When we must choose, show us the one You have chosen."
      ref: Acts 1:24
  2:
    - text: "I call on Your name, Lord. Thank You that everyone who calls on it will be saved."
      ref: Acts 2:21
    - text: "Thank You, God, that You raised Jesus from the dead, for death could not keep Him in its grip."
      ref: Acts 2:24
    - text: "Help me devote myself to the apostles' teaching, to fellowship, to the breaking of bread and to prayer."
      ref: Acts 2:42
  3:
    - text: "Help me give what I have in the name of Jesus Christ, even when I have no silver or gold."
      ref: Acts 3:6
    - text: "Give me faith in the name of Jesus, the faith that comes through Him."
      ref: Acts 3:16
    - text: "I turn back to You, Lord. Wipe away my sins, and send times of refreshing from Your presence."
      ref: Acts 3:19-20
  4:
    - text: "Thank You that salvation is in Jesus alone, for there is no other name by which we must be saved."
      ref: Acts 4:12
    - text: "Give me boldness, though I am an ordinary person, so that others see that I have been with Jesus."
      ref: Acts 4:13
    - text: "Lord, enable me, Your servant, to speak Your word with complete boldness."
      ref: Acts 4:29
  5:
    - text: "Make me one who obeys You, God, rather than people."
      ref: Acts 5:29
    - text: "Thank You for exalting Jesus to Your right hand as Savior, to grant repentance and forgiveness of sins."
      ref: Acts 5:31
    - text: "Help me never stop telling the good news that Jesus is the Christ, day after day."
      ref: Acts 5:42
  6:
    - text: "Fill those who serve others with the Spirit and with wisdom."
      ref: Acts 6:3
    - text: "Help us devote ourselves to prayer and to the ministry of the word."
      ref: Acts 6:4
    - text: "Let the word of God continue to spread, and let the number of disciples grow."
      ref: Acts 6:7
  7:
    - text: "Fill me with the Holy Spirit, and help me look to heaven and the glory of God."
      ref: Acts 7:55
    - text: "Lord Jesus, I give You my spirit. Receive it."
      ref: Acts 7:59
    - text: "Lord, give me a heart that asks You not to hold sin against those who hurt me."
      ref: Acts 7:60
  8:
    - text: "Wherever I go, Lord, help me speak Your word as those scattered believers did."
      ref: Acts 8:4
    - text: "I repent of my wickedness and pray to You, Lord. Forgive the intent of my heart."
      ref: Acts 8:22
    - text: "Lord, I do not always understand what I read. Send someone to guide me."
      ref: Acts 8:31
  9:
    - text: "Lord Jesus, tell me what I must do, and give me a heart to get up and obey."
      ref: Acts 9:6
    - text: "Let our church live in the fear of the Lord and the encouragement of the Holy Spirit."
      ref: Acts 9:31
    - text: "Make me always busy with works of kindness and charity."
      ref: Acts 9:36
  10:
    - text: "Let my prayers and my gifts to the poor rise before You, God, as a memorial offering."
      ref: Acts 10:4
    - text: "Thank You that You show no favoritism, and welcome from every nation those who fear You and do right."
      ref: Acts 10:34-35
    - text: "I believe in Jesus. Thank You that everyone who believes in Him receives forgiveness of sins through His name."
      ref: Acts 10:43
  11:
    - text: "Keep me from hindering Your work, Lord, when You give the same gift to others as You gave me."
      ref: Acts 11:17
    - text: "Help me abide in You, Lord, with all my heart."
      ref: Acts 11:23
    - text: "Make me a good person, full of the Holy Spirit and of faith."
      ref: Acts 11:24
  12:
    - text: "Teach us to pray to You fervently for those in prison, as the church did."
      ref: Acts 12:5
    - text: "Lord, open my eyes to see when You have rescued me, and to know for sure it was You."
      ref: Acts 12:11
    - text: "Let Your word continue to spread and multiply."
      ref: Acts 12:24
  13:
    - text: "Speak by Your Holy Spirit while I worship You, and show me the work to which You call me."
      ref: Acts 13:2
    - text: "Thank You that through Jesus forgiveness of sins is proclaimed, and everyone who believes is justified."
      ref: Acts 13:38-39
    - text: "Fill me with joy and with the Holy Spirit."
      ref: Acts 13:52
  14:
    - text: "Turn me from every worthless thing to You, the living God, who made heaven, earth and sea."
      ref: Acts 14:15
    - text: "Thank You for rain from heaven and fruitful seasons, and for filling our hearts with food and gladness."
      ref: Acts 14:17
    - text: "Strengthen my soul and keep me in the faith, through the hardships I meet on the way to Your kingdom."
      ref: Acts 14:22
  15:
    - text: "God, You know the heart. Cleanse mine by faith, as You cleansed the hearts of those who believed."
      ref: Acts 15:8-9
    - text: "I believe that it is through the grace of the Lord Jesus that I am saved."
      ref: Acts 15:11
    - text: "When we decide matters together, let it seem good to the Holy Spirit and to us."
      ref: Acts 15:28
  16:
    - text: "Lord, open my heart to respond to Your message."
      ref: Acts 16:14
    - text: "Teach me to pray and sing hymns to You, even at midnight, while others listen."
      ref: Acts 16:25
    - text: "I believe in the Lord Jesus. Save me, and bring my household to believe in You too."
      ref: Acts 16:31
  17:
    - text: "Help me receive teaching eagerly, and examine the Bible every day to see if what I hear is true."
      ref: Acts 17:11
    - text: "Thank You, Lord of heaven and earth, for giving me life and breath and everything else."
      ref: Acts 17:24-25
    - text: "I seek You, Lord, and I thank You that You are not far from me."
      ref: Acts 17:27
  18:
    - text: "Lord, when I am afraid, keep me speaking of You, and be with me."
      ref: Acts 18:9-10
    - text: "Teach me to say of my plans, I will do this if God is willing."
      ref: Acts 18:21
    - text: "Give me a humble heart to be taught Your way more accurately."
      ref: Acts 18:26
  19:
    - text: "Let the name of the Lord Jesus be held in high honor among us."
      ref: Acts 19:17
    - text: "Give me the courage to confess my deeds openly, as those believers did."
      ref: Acts 19:18
    - text: "Let the word of the Lord continue to spread and prevail with power."
      ref: Acts 19:20
  20:
    - text: "Help me finish my course and complete the work You gave me, testifying to the good news of Your grace."
      ref: Acts 20:24
    - text: "I commit myself to You and to the word of Your grace, which can build me up."
      ref: Acts 20:32
    - text: "Teach me to help the weak, remembering that it is more blessed to give than to receive."
      ref: Acts 20:35
  21:
    - text: "When we say goodbye, let us kneel and pray together, families and friends alike."
      ref: Acts 21:5
    - text: "Teach me to say from my heart, Lord, Your will be done."
      ref: Acts 21:14
    - text: "Help me tell others what You have done, so that they glorify You."
      ref: Acts 21:19-20
  22:
    - text: "Who are You, Lord? Make Yourself known to me, as You did to Paul."
      ref: Acts 22:8
    - text: "What should I do, Lord? Tell me all that You have appointed me to do."
      ref: Acts 22:10
    - text: "Let me know Your will and hear Your voice, and make me Your witness to everyone."
      ref: Acts 22:14-15
  23:
    - text: "Help me live before You, God, in all good conscience."
      ref: Acts 23:1
    - text: "Keep my hope in the resurrection of the dead alive in me."
      ref: Acts 23:6
    - text: "Stand near me, Lord, when I am afraid, and tell me to take courage."
      ref: Acts 23:11
  24:
    - text: "Help me always to strive for a clear conscience before You and before people."
      ref: Acts 24:16
    - text: "Thank You for friends who care for the needs of those who are in prison."
      ref: Acts 24:23
    - text: "Teach me righteousness and self-control, and keep me from putting You off until I find the time."
      ref: Acts 24:25
  25:
    - text: "Help me live so that, if I am accused falsely, I can say truthfully that I have done no wrong."
      ref: Acts 25:8
    - text: "Lord, give judges the fairness to let the accused face their accusers and defend themselves."
      ref: Acts 25:16
    - text: "Thank You that Jesus, who died, is alive. Help me affirm this boldly."
      ref: Acts 25:19
  26:
    - text: "Open the eyes of those around me, so that they turn from darkness to light and receive forgiveness of sins."
      ref: Acts 26:18
    - text: "Keep me from being disobedient to what You have shown me."
      ref: Acts 26:19
    - text: "Thank You, God, for helping me to this day. Help me testify to small and great alike."
      ref: Acts 26:22
  27:
    - text: "You are the God to whom I belong and whom I serve. Stand beside me, and take away my fear."
      ref: Acts 27:23-24
    - text: "Give me faith to believe You, God, that it will be just as You have said."
      ref: Acts 27:25
    - text: "Teach me to give thanks to You over my bread, even in front of everyone."
      ref: Acts 27:35
  28:
    - text: "Teach me to show extraordinary kindness to strangers who arrive cold, wet and in need."
      ref: Acts 28:2
    - text: "Thank You, God, for fellow believers who travel to meet and encourage us."
      ref: Acts 28:15
    - text: "Help me to speak boldly and freely of Your kingdom, and to teach about the Lord Jesus Christ."
      ref: Acts 28:31
