book: Luke
reviewed: false
chapters:
  1:
    - text: "Thank You that no word from You will ever fail. Help me trust what You have said."
      ref: Luke 1:37
    - text: "I am Your servant, Lord. May it happen to me according to Your word."
      ref: Luke 1:38
    - text: "Help me serve You without fear, in holiness and righteousness, all the days of my life."
      ref: Luke 1:74-75
  2:
    - text: "Thank You for the Savior who was born for us, Christ the Lord."
      ref: Luke 2:11
    - text: "Help me treasure what You do and ponder it in my heart."
      ref: Luke 2:19
    - text: "Help me grow in wisdom, and in favor with God and with people."
      ref: Luke 2:52
  3:
    - text: "Let my life produce fruit in keeping with repentance."
      ref: Luke 3:8
    - text: "Help me share what I have with the one who has none, my clothes and my food."
      ref: Luke 3:11
    - text: "Father, thank You that Jesus is Your beloved Son, and that You are well pleased with Him."
      ref: Luke 3:22
  4:
    - text: "Let me worship You, Lord my God, and give my service to You only."
      ref: Luke 4:8
    - text: "Thank You that You sent Jesus to preach good news to the poor and to release the oppressed."
      ref: Luke 4:18
    - text: "Jesus, I bring to You those who are ill. You laid Your hands on each one and healed them."
      ref: Luke 4:40
  5:
    - text: "Lord, when I have worked hard and caught nothing, help me obey because You say so."
      ref: Luke 5:5
    - text: "Teach me to slip away to quiet places and pray, as Jesus often did."
      ref: Luke 5:16
    - text: "Thank You, Jesus, for calling sinners like me to repentance."
      ref: Luke 5:32
  6:
    - text: "Teach me to do good to those who hate me, and to pray for those who mistreat me."
      ref: Luke 6:27-28
    - text: "Father, You are merciful. Make me merciful, just as You are."
      ref: Luke 6:36
    - text: "Lord, keep me from calling You Lord and not doing what You say."
      ref: Luke 6:46
  7:
    - text: "Lord, I am not worthy, but just say the word and heal the one I pray for."
      ref: Luke 7:7
    - text: "Lord, have compassion on those who weep, as You had compassion on the widow."
      ref: Luke 7:13
    - text: "Forgive my many sins, Lord, and let me love You much."
      ref: Luke 7:47
  8:
    - text: "Give me a noble and good heart that hears Your word, clings to it and perseveres."
      ref: Luke 8:15
    - text: "Help me tell those at home how much You have done for me."
      ref: Luke 8:39
    - text: "Do not let me be afraid, Lord. Help me just believe."
      ref: Luke 8:50
  9:
    - text: "Help me deny myself, take up my cross daily and follow You."
      ref: Luke 9:23
    - text: "Father, help me listen to Your Son, whom You have chosen."
      ref: Luke 9:35
    - text: "Keep me from seeking to be the greatest. Help me welcome little children in Your name."
      ref: Luke 9:48
  10:
    - text: "Lord of the harvest, send out workers into Your harvest, for the workers are few."
      ref: Luke 10:2
    - text: "Help me love You with all my heart, soul, strength and mind, and love my neighbor as myself."
      ref: Luke 10:27
    - text: "Help me choose the good portion, to sit at Your feet and listen to Your message."
      ref: Luke 10:42
  11:
    - text: "Lord, teach us to pray, as Your disciples asked You."
      ref: Luke 11:1
    - text: "Father in heaven, I ask You for the Holy Spirit."
      ref: Luke 11:13
    - text: "Make me one of those who hear the word of God and obey it."
      ref: Luke 11:28
  12:
    - text: "Thank You that the very hairs of my head are numbered. Help me not to be afraid."
      ref: Luke 12:7
    - text: "Guard me against every kind of greed, for life is more than having many possessions."
      ref: Luke 12:15
    - text: "Help me seek Your kingdom, and trust that You will add what I need."
      ref: Luke 12:31
  13:
    - text: "Let Your kingdom grow, Lord, like a mustard seed that becomes a tree."
      ref: Luke 13:19
    - text: "Help me make every effort to enter through the narrow door."
      ref: Luke 13:24
    - text: "Gather me under Your wings, as a hen gathers her chicks. Make me willing."
      ref: Luke 13:34
  14:
    - text: "Keep me from exalting myself. Teach me to humble myself before You."
      ref: Luke 14:11
    - text: "Help me welcome the poor and the lame, who cannot repay me."
      ref: Luke 14:13-14
    - text: "Help me count the cost of following You, so that I can finish what I begin."
      ref: Luke 14:28
  15:
    - text: "Thank You that there is joy in heaven over one sinner who repents."
      ref: Luke 15:7
    - text: "Father, I will get up and come back to You. I have sinned against heaven and against You."
      ref: Luke 15:18
    - text: "Father, I come to You. Meet me with compassion, as the father ran to his son."
      ref: Luke 15:20
  16:
    - text: "Help me be faithful with very little, so that I am faithful with much."
      ref: Luke 16:10
    - text: "Help me serve You, God, and not to serve money."
      ref: Luke 16:13
    - text: "Lord, You know my heart. Keep me from trying to justify myself before people."
      ref: Luke 16:15
  17:
    - text: "Help me forgive each time someone comes back and says they repent."
      ref: Luke 17:4
    - text: "Lord, increase my faith, as Your apostles asked."
      ref: Luke 17:5
    - text: "When You have helped me, let me come back to You with loud praise."
      ref: Luke 17:15
  18:
    - text: "Teach me to pray at all times and not lose heart."
      ref: Luke 18:1
    - text: "God, I come to You as the tax collector did. Have mercy on me, a sinner."
      ref: Luke 18:13
    - text: "Thank You that what is impossible with people is possible with You."
      ref: Luke 18:27
  19:
    - text: "Lord, if I have cheated anyone, help me repay it. Make me generous to the poor."
      ref: Luke 19:8
    - text: "Thank You, Jesus, for coming to seek and to save the lost."
      ref: Luke 19:10
    - text: "Let me praise You joyfully, in a loud voice, for all the miracles You have done."
      ref: Luke 19:37
  20:
    - text: "Thank You, Father, that the stone the builders rejected has become the cornerstone."
      ref: Luke 20:17
    - text: "Teach me to give to God what is God's, and to the government what is its due."
      ref: Luke 20:25
    - text: "Thank You that You are the God of the living, for to You all are alive."
      ref: Luke 20:38
  21:
    - text: "Teach me to give as the poor widow did, not only from what I have to spare."
      ref: Luke 21:4
    - text: "Thank You, Jesus, that Your words will never pass away, though heaven and earth will."
      ref: Luke 21:33
    - text: "Keep my heart from being weighed down by drunkenness and the worries of life."
      ref: Luke 21:34
  22:
    - text: "Jesus, thank You for giving Your body for me. Help me remember You."
      ref: Luke 22:19
    - text: "Lord, keep my faith from failing, and help me strengthen others."
      ref: Luke 22:32
    - text: "Father, when I ask You for things, let Your will be done, not mine."
      ref: Luke 22:42
  23:
    - text: "Father, as Jesus asked You to forgive those who crucified Him, help me forgive those who wrong me."
      ref: Luke 23:34
    - text: "Jesus, remember me when You come into Your kingdom, as the criminal beside You asked."
      ref: Luke 23:42
    - text: "Father, into Your hands I commit my spirit, as Jesus did."
      ref: Luke 23:46
  24:
    - text: "Thank You, Father, that Jesus is not here among the dead. He has risen."
      ref: Luke 24:6
    - text: "Stay with me, Lord, as evening comes and the day is almost over."
      ref: Luke 24:29
    - text: "Open the Bible to me, Lord, and let my heart burn within me as I listen."
      ref: Luke 24:32
