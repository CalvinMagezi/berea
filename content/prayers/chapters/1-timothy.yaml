book: 1 Timothy
reviewed: false
chapters:
  1:
    - text: "Give me love that comes from a pure heart, a clear conscience and a sincere faith."
      ref: 1 Timothy 1:5
    - text: "Thank You that Christ Jesus came into the world to save sinners, and I receive this."
      ref: 1 Timothy 1:15
    - text: "To You, the king eternal, immortal and invisible, the only God, be honor and glory forever and ever. Amen."
      ref: 1 Timothy 1:17
  2:
    - text: "Teach me to offer petitions, prayers, intercessions and thanks for everyone, including those in authority."
      ref: 1 Timothy 2:1-2
    - text: "God our Savior, You want everyone to be saved and to know the truth. Help me pray for this."
      ref: 1 Timothy 2:4
    - text: "Thank You for Christ Jesus, the one mediator between God and people, who gave Himself as a ransom for all."
      ref: 1 Timothy 2:5-6
  3:
    - text: "Make those who lead Your church above reproach, temperate, self-controlled, respectable, hospitable and able to teach."
      ref: 1 Timothy 3:2
    - text: "Help us live rightly in Your household, the church of the living God, the pillar and foundation of the truth."
      ref: 1 Timothy 3:15
    - text: "Thank You that Jesus appeared in the flesh, was proclaimed among the nations, and was taken up in glory."
      ref: 1 Timothy 3:16
  4:
    - text: "Help me train for godliness, which is valuable in every way, for this life and the next."
      ref: 1 Timothy 4:8
    - text: "I set my hope on You, the living God, the Savior of everyone, and especially of those who believe."
      ref: 1 Timothy 4:10
    - text: "Help me set an example for believers in speech, in conduct, in love, in faith and in purity."
      ref: 1 Timothy 4:12
  5:
    - text: "Comfort the widow who is truly in need and left alone, who hopes in You and prays night and day."
      ref: 1 Timothy 5:5
    - text: "Help me provide for my own, and especially for my household."
      ref: 1 Timothy 5:8
    - text: "Help me honor the elders who lead well, especially those who work hard at preaching and teaching."
      ref: 1 Timothy 5:17
  6:
    - text: "Teach me godliness with contentment, for that is great gain."
      ref: 1 Timothy 6:6
    - text: "Keep me from the love of money, and help me pursue righteousness, godliness, faith, love, perseverance and gentleness."
      ref: 1 Timothy 6:10-11
    - text: "Keep my hope in You, God, who richly provides all things for us to enjoy, and not in wealth."
      ref: 1 Timothy 6:17
