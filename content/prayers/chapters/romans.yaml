book: Romans
reviewed: true
chapters:
  1:
    - text: "Keep me from being ashamed of the gospel, for it is Your power for salvation to everyone who believes."
      ref: Romans 1:16
    - text: "Let me live by faith from start to finish, for it is written that the righteous will live by faith."
      ref: Romans 1:17
    - text: "Keep me from forgetting to glorify You as God and to give You thanks."
      ref: Romans 1:21
  2:
    - text: "Keep me from passing judgment on others while I do the same things myself."
      ref: Romans 2:1
    - text: "Thank You for the riches of Your kindness, tolerance and patience. Let Your kindness lead me to repentance."
      ref: Romans 2:4
    - text: "Change my heart by Your Spirit, and let me seek praise from You rather than from people."
      ref: Romans 2:29
  3:
    - text: "I fall short of Your glory. Thank You for justifying me freely by Your grace in Christ Jesus."
      ref: Romans 3:23-24
    - text: "Thank You for presenting Jesus as an atoning sacrifice in His blood, received through faith."
      ref: Romans 3:25
    - text: "Keep me from boasting. Thank You that I am justified by faith, apart from works of the law."
      ref: Romans 3:27-28
  4:
    - text: "I believe in You, who justify the ungodly. Thank You that faith is credited as righteousness."
      ref: Romans 4:5
    - text: "Forgive my lawless acts and cover my sins. Blessed is the one whose sin You never count against him."
      ref: Romans 4:7-8
    - text: "Keep me from wavering in disbelief. Make me fully persuaded that You are able to do what You have promised."
      ref: Romans 4:20-21
  5:
    - text: "Thank You that through faith in our Lord Jesus Christ I have peace with You."
      ref: Romans 5:1
    - text: "Thank You that hope does not disappoint, for You have poured Your love into our hearts through the Holy Spirit."
      ref: Romans 5:5
    - text: "Thank You that while I was still a sinner, Christ died for me."
      ref: Romans 5:8
  6:
    - text: "Help me count myself dead to sin, but alive to You in Christ Jesus."
      ref: Romans 6:11
    - text: "I present myself to You, brought from death to life, and my body as an instrument of righteousness."
      ref: Romans 6:13
    - text: "Thank You that the gift of God is eternal life in Christ Jesus our Lord."
      ref: Romans 6:23
  7:
    - text: "Lord, I do not do the good I want to do. Have mercy on me and help me."
      ref: Romans 7:19
    - text: "Let me delight in Your law in my inner being, Lord."
      ref: Romans 7:22
    - text: "I cry out for rescue from this body of death. Thanks be to God, through Jesus Christ our Lord."
      ref: Romans 7:24-25
  8:
    - text: "Father, I do not know how I ought to pray. Thank You that Your Spirit helps me in my weakness."
      ref: Romans 8:26
    - text: "Help me trust that You work all things together for the good of those who love You."
      ref: Romans 8:28
    - text: "Thank You that nothing in all creation will separate us from Your love in Christ Jesus our Lord."
      ref: Romans 8:38-39
  9:
    - text: "Christ, You are God over all, forever worthy of praise. Amen."
      ref: Romans 9:5
    - text: "I depend on Your mercy, God, and not on my own desire or effort."
      ref: Romans 9:16
    - text: "Thank You that those who believe in Jesus will never be put to shame."
      ref: Romans 9:33
  10:
    - text: "Jesus is Lord. I believe in my heart that You raised Him from the dead."
      ref: Romans 10:9
    - text: "Send people to preach the good news, so that those who have not heard may hear and call on You."
      ref: Romans 10:14-15
    - text: "Let my faith grow as I hear the word of Christ."
      ref: Romans 10:17
  11:
    - text: "I stand by faith. Keep me from arrogance, and help me continue in Your kindness."
      ref: Romans 11:20-22
    - text: "How deep are the riches of Your wisdom and knowledge, God! Your ways are beyond tracing."
      ref: Romans 11:33
    - text: "All things are from You, through You and to You. To You be the glory forever. Amen."
      ref: Romans 11:36
  12:
    - text: "Lord, on account of Your mercy, I give You my body as a living sacrifice, holy and pleasing to You."
      ref: Romans 12:1
    - text: "Keep me from being conformed to this world, and transform me by renewing my mind."
      ref: Romans 12:2
    - text: "Make me joyful in hope, patient in affliction and persistent in prayer."
      ref: Romans 12:12
  13:
    - text: "Help me submit to the governing authorities, for there is no authority except what is from You."
      ref: Romans 13:1
    - text: "Let my love do no wrong to my neighbor, for love is the fulfillment of the law."
      ref: Romans 13:10
    - text: "Clothe me with the Lord Jesus Christ, and let me make no provision for the desires of the flesh."
      ref: Romans 13:14
  14:
    - text: "Help me accept those whose faith is weak, without passing judgment on their opinions."
      ref: Romans 14:1
    - text: "Whether I live or die, I belong to You, Lord."
      ref: Romans 14:8
    - text: "Let me live for Your kingdom, which is righteousness, peace and joy in the Holy Spirit."
      ref: Romans 14:17
  15:
    - text: "Let what was written in the past teach me, so that through endurance and encouragement I have hope."
      ref: Romans 15:4
    - text: "Help me accept others as Christ accepted me, to bring glory to God."
      ref: Romans 15:7
    - text: "God of hope, fill me with joy and peace in believing. Let me overflow with hope by the Holy Spirit."
      ref: Romans 15:13
  16:
    - text: "Thank You for the women who have worked very hard in the Lord. Teach me to work as they did."
      ref: Romans 16:12
    - text: "Make me wise about what is good and innocent about what is evil."
      ref: Romans 16:19
    - text: "To You, the only wise God, be glory forever through Jesus Christ. Amen."
      ref: Romans 16:27
