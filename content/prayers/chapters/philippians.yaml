book: Philippians
reviewed: true
chapters:
  1:
    - text: "I am confident that You, who began a good work in me, will carry it on to completion."
      ref: Philippians 1:6
    - text: "Let my love abound more and more in knowledge and depth of insight."
      ref: Philippians 1:9
    - text: "Help me conduct myself in a manner worthy of the gospel of Christ."
      ref: Philippians 1:27
  2:
    - text: "Keep me from selfish ambition and empty pride, and in humility help me consider others more important than myself."
      ref: Philippians 2:3
    - text: "Thank You, Jesus, for emptying Yourself, taking the form of a servant, and being obedient to death on a cross."
      ref: Philippians 2:7-8
    - text: "Work in me, God, to will and to act for Your good purpose."
      ref: Philippians 2:13
  3:
    - text: "Let nothing compare with the surpassing excellence of knowing Christ Jesus my Lord."
      ref: Philippians 3:8
    - text: "Help me press on to take hold of that for which Christ Jesus took hold of me."
      ref: Philippians 3:12
    - text: "Thank You that our citizenship is in heaven. Help us eagerly await our Savior, the Lord Jesus Christ."
      ref: Philippians 3:20
  4:
    - text: "Teach me to rejoice in You, Lord, always."
      ref: Philippians 4:4
    - text: "Let Your peace, which surpasses all understanding, guard my heart and mind in Christ Jesus."
      ref: Philippians 4:7
    - text: "Help me think about whatever is true, honorable, right, pure, lovely and admirable."
      ref: Philippians 4:8
