book: 1 Corinthians
reviewed: true
chapters:
  1:
    - text: "You are faithful, God, and You have called me into fellowship with Your Son, Jesus Christ our Lord."
      ref: 1 Corinthians 1:9
    - text: "Thank You that the message of the cross, foolish to some, is Your power to us who are being saved."
      ref: 1 Corinthians 1:18
    - text: "Thank You that we are in Christ Jesus, who is our wisdom from God, our righteousness, holiness and redemption."
      ref: 1 Corinthians 1:30
  2:
    - text: "When I am with others, help me resolve to know nothing except Jesus Christ and Him crucified."
      ref: 1 Corinthians 2:2
    - text: "Thank You for what You have prepared for those who love You, more than I can imagine."
      ref: 1 Corinthians 2:9
    - text: "Thank You for Your Spirit. Help me understand what You have freely given us."
      ref: 1 Corinthians 2:12
  3:
    - text: "When I plant and others water, let me remember that You, God, make it grow."
      ref: 1 Corinthians 3:6
    - text: "Help me build on the foundation already laid, which is Jesus Christ."
      ref: 1 Corinthians 3:11
    - text: "Thank You that we are Your temple, and that Your Spirit dwells in us."
      ref: 1 Corinthians 3:16
  4:
    - text: "Help me be found faithful, as every steward must be."
      ref: 1 Corinthians 4:2
    - text: "Lord, I have nothing that I did not receive. Keep me from boasting as though I had not received it."
      ref: 1 Corinthians 4:7
    - text: "When I am insulted, help me to bless. When I am persecuted, help me to endure."
      ref: 1 Corinthians 4:12
  5:
    - text: "Thank You that Christ, our Passover lamb, has been sacrificed."
      ref: 1 Corinthians 5:7
    - text: "Let me keep the feast with sincerity and truth, not with malice and wickedness."
      ref: 1 Corinthians 5:8
  6:
    - text: "Thank You for washing, sanctifying and justifying me in the name of the Lord Jesus Christ and by Your Spirit."
      ref: 1 Corinthians 6:11
    - text: "Help me choose what is beneficial, and let nothing master me."
      ref: 1 Corinthians 6:12
    - text: "You bought me at a price. Help me glorify You with my body."
      ref: 1 Corinthians 6:20
  7:
    - text: "Thank You that each of us has our own gift from You, one this and another that."
      ref: 1 Corinthians 7:7
    - text: "Help me lead the life You have assigned to me and called me to."
      ref: 1 Corinthians 7:17
    - text: "Give me undivided devotion to You, Lord."
      ref: 1 Corinthians 7:35
  8:
    - text: "Keep knowledge from puffing me up, and teach me the love that builds up."
      ref: 1 Corinthians 8:1
    - text: "You, Father, are the one God, from whom all things came and for whom we exist."
      ref: 1 Corinthians 8:6
    - text: "Keep my freedom from becoming a stumbling block to those who are weak."
      ref: 1 Corinthians 8:9
  9:
    - text: "Teach me to become all things to all people, so that some may be saved."
      ref: 1 Corinthians 9:22
    - text: "Let all I do be for the sake of the gospel."
      ref: 1 Corinthians 9:23
    - text: "Help me train with strict discipline, not for a crown that perishes, but for one that is imperishable."
      ref: 1 Corinthians 9:25
  10:
    - text: "You are faithful. Keep me from being tempted beyond what I can bear, and give me a way out."
      ref: 1 Corinthians 10:13
    - text: "Help me seek the good of others, and not my own good alone."
      ref: 1 Corinthians 10:24
    - text: "Whether I eat or drink or whatever I do, let me do it all to Your glory."
      ref: 1 Corinthians 10:31
  11:
    - text: "Lord Jesus, You asked us to eat the bread and drink the cup in remembrance of You. Thank You."
      ref: 1 Corinthians 11:24-25
    - text: "Each time I eat this bread and drink this cup, help me proclaim the Lord's death until He comes."
      ref: 1 Corinthians 11:26
    - text: "Help me examine myself before I eat the bread and drink the cup."
      ref: 1 Corinthians 11:28
  12:
    - text: "Thank You that I can say Jesus is Lord. No one can, except by the Holy Spirit."
      ref: 1 Corinthians 12:3
    - text: "Thank You that the Spirit gives a gift to each of us for the common good."
      ref: 1 Corinthians 12:7
    - text: "Let there be no division among us. Help us care for one another."
      ref: 1 Corinthians 12:25
  13:
    - text: "Give me love, Lord. Without it, even giving all I own gains me nothing."
      ref: 1 Corinthians 13:3
    - text: "Teach me to love in such a way that I keep no account of wrongs."
      ref: 1 Corinthians 13:5
    - text: "I know only in part now. I trust that I will know fully, as You fully know me."
      ref: 1 Corinthians 13:12
  14:
    - text: "Teach me to pray and sing with my spirit, and with my mind also."
      ref: 1 Corinthians 14:15
    - text: "When we come together, let all that we bring build up the church."
      ref: 1 Corinthians 14:26
    - text: "Thank You that You are not a God of disorder, but of peace."
      ref: 1 Corinthians 14:33
  15:
    - text: "Thank You that Christ died for our sins, was buried, and was raised on the third day."
      ref: 1 Corinthians 15:3-4
    - text: "Thank You, God, for giving us the victory through our Lord Jesus Christ."
      ref: 1 Corinthians 15:57
    - text: "Make me steadfast and immovable, knowing that my labor in the Lord is not in vain."
      ref: 1 Corinthians 15:58
  16:
    - text: "Help me set aside a portion of my income every week for the collection for the saints."
      ref: 1 Corinthians 16:2
    - text: "Keep me alert and standing firm in the faith. Give me courage and strength."
      ref: 1 Corinthians 16:13
    - text: "Help me do everything in love."
      ref: 1 Corinthians 16:14
