book: Revelation
reviewed: false
chapters:
  1:
    - text: "Help me hear and obey what is written in this prophecy, for those who do are blessed."
      ref: Revelation 1:3
    - text: "Jesus, You love us and have released us from our sins by Your blood. Glory and power be Yours forever."
      ref: Revelation 1:5-6
    - text: "Thank You, Jesus, that You were dead and are alive forever and ever."
      ref: Revelation 1:18
  2:
    - text: "If I have left my first love, help me repent and do the deeds I did at first."
      ref: Revelation 2:4-5
    - text: "Give me an ear to hear what the Spirit says to the churches."
      ref: Revelation 2:7
    - text: "Help me not to fear suffering, but to be faithful, trusting Your promise of the crown of life."
      ref: Revelation 2:10
  3:
    - text: "Though my strength is little, help me keep Your word and not deny Your name."
      ref: Revelation 3:8
    - text: "When You rebuke and discipline me because You love me, make me earnest to repent."
      ref: Revelation 3:19
    - text: "I hear Your voice at the door, Lord Jesus. I open it. Come in and eat with me."
      ref: Revelation 3:20
  4:
    - text: "You are holy, holy, holy, Lord God Almighty, who was and is and is to come."
      ref: Revelation 4:8
    - text: "I give You glory, honor and thanks, for You sit on the throne and live forever and ever."
      ref: Revelation 4:9
    - text: "I bow before You and worship You, who live forever and ever."
      ref: Revelation 4:10
  5:
    - text: "Thank You that Jesus has triumphed to open the scroll and its seven seals."
      ref: Revelation 5:5
    - text: "Jesus, You are worthy, for You were slain, and by Your blood You bought people for God from every nation."
      ref: Revelation 5:9
    - text: "To You who sit on the throne, and to the Lamb, be praise, honor, glory and power forever and ever."
      ref: Revelation 5:13
  6:
    - text: "I do not understand all of this chapter. Thank You that it is the Lamb who opens the seals."
      ref: Revelation 6:1
    - text: "Thank You that each one slain for Your word was given a white robe."
      ref: Revelation 6:9-11
  7:
    - text: "I join the multitude from every nation, tribe and tongue, crying, salvation belongs to our God and to the Lamb."
      ref: Revelation 7:9-10
    - text: "Thank You that those from the great tribulation washed their robes white in the blood of the Lamb."
      ref: Revelation 7:14
    - text: "Thank You that the Lamb will shepherd Your people and lead them to springs of living water."
      ref: Revelation 7:17
  8:
    - text: "Thank You that the prayers of all the saints are offered on the golden altar before Your throne."
      ref: Revelation 8:3
    - text: "Lord, let my prayers rise before You, as the prayers of the saints rose with the smoke of incense."
      ref: Revelation 8:4
  9:
    - text: "Keep me from idols that cannot see or hear or walk, and give me a heart that repents."
      ref: Revelation 9:20
    - text: "Help me to repent of my sins and never refuse to turn from them."
      ref: Revelation 9:21
  10:
    - text: "You live forever and ever, and You created heaven, the earth and the sea, and everything in them."
      ref: Revelation 10:6
    - text: "Thank You that the mystery of God will be fulfilled, just as You proclaimed to Your servants the prophets."
      ref: Revelation 10:7
  11:
    - text: "Thank You that the kingdom of the world has become the kingdom of our Lord and of His Christ."
      ref: Revelation 11:15
    - text: "We give thanks to You, Lord God Almighty, because You have taken Your great power and begun to reign."
      ref: Revelation 11:17
  12:
    - text: "Thank You that the salvation, power and kingdom of our God, and the authority of His Christ, have come."
      ref: Revelation 12:10
    - text: "Help me conquer the accuser by the blood of the Lamb and by the word of my testimony."
      ref: Revelation 12:11
    - text: "Help me keep the commandments of God and hold to the testimony of Jesus."
      ref: Revelation 12:17
  13:
    - text: "Give me the perseverance and faith that You call Your saints to have."
      ref: Revelation 13:10
    - text: "Lord, this passage is a call for wisdom. Give me wisdom and insight as I read."
      ref: Revelation 13:18
  14:
    - text: "Thank You that the eternal gospel is for every nation, tribe, tongue and people."
      ref: Revelation 14:6
    - text: "Give me the perseverance to keep Your commandments and the faith of Jesus."
      ref: Revelation 14:12
    - text: "Thank You that those who die in the Lord are blessed, and rest from their labors."
      ref: Revelation 14:13
  15:
    - text: "Lord God Almighty, Your works are great and wonderful, and Your ways are just and true."
      ref: Revelation 15:3
    - text: "You alone are holy. Let me fear You and glorify Your name."
      ref: Revelation 15:4
    - text: "Thank You that all nations will come and worship before You."
      ref: Revelation 15:4
  16:
    - text: "Lord God Almighty, I praise You that Your judgments are true and just."
      ref: Revelation 16:7
    - text: "Help me to remain awake and clothed, ready for the day You come like a thief."
      ref: Revelation 16:15
  17:
    - text: "Lord, this chapter is hard. Give me a mind with wisdom to understand what You have shown."
      ref: Revelation 17:9
    - text: "Jesus, You are Lord of lords, and Your called, chosen and faithful ones will be with You. Keep me faithful."
      ref: Revelation 17:14
    - text: "Thank You, God, that Your words will be fulfilled."
      ref: Revelation 17:17
  18:
    - text: "Help me to come out when You call, and not share in the sins of the great city."
      ref: Revelation 18:4
    - text: "Teach me that great wealth can be gone in a single hour, and keep my trust in You."
      ref: Revelation 18:17
  19:
    - text: "Hallelujah! You, the Lord our God the Almighty, reign."
      ref: Revelation 19:6
    - text: "Let us rejoice and be glad and give You the glory, for the marriage of the Lamb has come."
      ref: Revelation 19:7
    - text: "I want to be among those invited to the marriage supper of the Lamb, for they are blessed."
      ref: Revelation 19:9
  20:
    - text: "Help me be faithful like those who held to the testimony of Jesus and the word of God."
      ref: Revelation 20:4
    - text: "Thank You that the second death has no power over those who share in the first resurrection."
      ref: Revelation 20:6
  21:
    - text: "Thank You that You will dwell with us. We will be Your people, and You will be our God."
      ref: Revelation 21:3
    - text: "Thank You that You make all things new, and that Your words are faithful and true."
      ref: Revelation 21:5
    - text: "I am thirsty, Lord. Give me freely from the spring of the water of life."
      ref: Revelation 21:6
  22:
    - text: "Make me one of those who wash their robes, and have the right to the tree of life."
      ref: Revelation 22:14
    - text: "You say You are coming soon. Amen. Come, Lord Jesus."
      ref: Revelation 22:20
    - text: "May the grace of the Lord Jesus be with all the saints, and with me. Amen."
      ref: Revelation 22:21
