book: Galatians
reviewed: true
chapters:
  1:
    - text: "Thank You that Jesus gave Himself for our sins to rescue us from the present evil age."
      ref: Galatians 1:4
    - text: "Glory be to You, our God and Father, forever and ever. Amen."
      ref: Galatians 1:5
    - text: "Keep me from living to please people, for I want to be a servant of Christ."
      ref: Galatians 1:10
  2:
    - text: "Help me remember the poor, and make me eager to do so."
      ref: Galatians 2:10
    - text: "Thank You that I am justified by faith in Jesus Christ, and not by works of the law."
      ref: Galatians 2:16
    - text: "Help me live by faith in the Son of God, who loved me and gave Himself up for me."
      ref: Galatians 2:20
  3:
    - text: "Thank You that no one is justified by the law, but the righteous will live by faith."
      ref: Galatians 3:11
    - text: "Thank You, Christ, for redeeming us from the curse of the law by becoming a curse for us."
      ref: Galatians 3:13
    - text: "Thank You that in Christ Jesus we are all one, whether slave or free, man or woman, of any nation."
      ref: Galatians 3:28
  4:
    - text: "Thank You for sending Your Son when the time had fully come, that we might be adopted as Your sons."
      ref: Galatians 4:4-5
    - text: "Thank You for sending the Spirit of Your Son into our hearts, so that we can call You Father."
      ref: Galatians 4:6
    - text: "Work in us until Christ is formed in us."
      ref: Galatians 4:19
  5:
    - text: "Thank You, Christ, for setting us free. Help me stand firm and not return to a yoke of slavery."
      ref: Galatians 5:1
    - text: "Help me not to use my freedom for the flesh, but to serve others in love."
      ref: Galatians 5:13
    - text: "Grow the fruit of the Spirit in me: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control."
      ref: Galatians 5:22-23
  6:
    - text: "Help me carry the burdens of others, and so fulfill the law of Christ."
      ref: Galatians 6:2
    - text: "Keep me from growing weary of doing good, and from giving up before the harvest comes."
      ref: Galatians 6:9
    - text: "Let me boast in nothing but the cross of our Lord Jesus Christ."
      ref: Galatians 6:14
