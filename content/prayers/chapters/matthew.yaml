book: Matthew
reviewed: false
chapters:
  1:
    - text: "Thank You that Jesus came to save His people from their sins."
      ref: Matthew 1:21
    - text: "Thank You that in Jesus, God is with us."
      ref: Matthew 1:23
  2:
    - text: "I come to worship You, Jesus, the One who was born a king."
      ref: Matthew 2:2
    - text: "Lead me to Jesus, and let me rejoice with great delight when I find Him."
      ref: Matthew 2:10
    - text: "I bow before You, Jesus, and offer You my treasures as a gift."
      ref: Matthew 2:11
  3:
    - text: "Turn my heart to repent, Lord, for the kingdom of heaven is near."
      ref: Matthew 3:2
    - text: "Help me produce fruit in keeping with repentance."
      ref: Matthew 3:8
    - text: "Thank You, Father, that Jesus is Your beloved Son, and You are pleased with Him."
      ref: Matthew 3:17
  4:
    - text: "Teach me to live on every word that comes from Your mouth, not on bread alone."
      ref: Matthew 4:4
    - text: "Help me worship You, Lord my God, and serve You only."
      ref: Matthew 4:10
    - text: "Help me follow You at once, as the fishermen left their nets and followed You."
      ref: Matthew 4:20
  5:
    - text: "Make me poor in spirit, Lord, for the kingdom of heaven is theirs."
      ref: Matthew 5:3
    - text: "Make my heart pure, Lord, for the pure in heart will see God."
      ref: Matthew 5:8
    - text: "Let my light shine before others, so they see my good deeds and glorify You, Father."
      ref: Matthew 5:16
  6:
    - text: "Father, You are unseen and You see what is done in secret. Teach me to pray to You in secret."
      ref: Matthew 6:6
    - text: "Help me seek first Your kingdom and Your righteousness, trusting You to add what I need."
      ref: Matthew 6:33
    - text: "Keep me from worrying about tomorrow. Today has enough trouble of its own."
      ref: Matthew 6:34
  7:
    - text: "Thank You, Father, that You give good things to those who ask You. I ask You now."
      ref: Matthew 7:11
    - text: "Help me do to others what I would have them do to me."
      ref: Matthew 7:12
    - text: "Help me hear Your words and act on them, like a wise man building on the rock."
      ref: Matthew 7:24
  8:
    - text: "Lord, I kneel before You. If You are willing, You can make me clean."
      ref: Matthew 8:2
    - text: "Lord, I am not worthy to have You under my roof. I trust that Your word is enough."
      ref: Matthew 8:8
    - text: "Lord, when I feel I am perishing in the storm, I cry to You. Save me."
      ref: Matthew 8:25
  9:
    - text: "Thank You, Jesus, that You have authority on earth to forgive sins. Forgive mine."
      ref: Matthew 9:6
    - text: "Thank You, Jesus, that You had compassion on the crowds who were harassed and helpless."
      ref: Matthew 9:36
    - text: "Lord of the harvest, I ask You to send out workers into Your harvest."
      ref: Matthew 9:38
  10:
    - text: "Freely I have received from You. Teach me to give freely, too."
      ref: Matthew 10:8
    - text: "Thank You, Father, that I am worth more than many sparrows. Keep me from fear."
      ref: Matthew 10:31
    - text: "Help me give even a cup of cold water to one of Your little ones."
      ref: Matthew 10:42
  11:
    - text: "I praise You, Father, Lord of heaven and earth, for revealing these things to little children."
      ref: Matthew 11:25
    - text: "Jesus, I am weary and burdened. I come to You for rest."
      ref: Matthew 11:28
    - text: "Teach me to take Your yoke and learn from You, for You are gentle and humble in heart."
      ref: Matthew 11:29
  12:
    - text: "Thank You that Jesus will not break a bruised reed or put out a smoldering wick."
      ref: Matthew 12:20
    - text: "Make my heart good, for out of the overflow of the heart the mouth speaks."
      ref: Matthew 12:34
    - text: "Father in heaven, help me do Your will, for Jesus calls those who do it His family."
      ref: Matthew 12:50
  13:
    - text: "Keep the worries of this life and the deceitfulness of wealth from choking Your word in me."
      ref: Matthew 13:22
    - text: "Make my heart good soil. Help me hear Your word, understand it and bear fruit."
      ref: Matthew 13:23
    - text: "Make Your kingdom my treasure. Give me the joy of the man who found it."
      ref: Matthew 13:44
  14:
    - text: "Take what little I have, Jesus. Bless it, and let it feed others."
      ref: Matthew 14:19
    - text: "Jesus, when I am afraid, say to me again: take courage, it is I."
      ref: Matthew 14:27
    - text: "Lord, when I begin to sink, I cry out to You. Save me!"
      ref: Matthew 14:30
  15:
    - text: "Keep my heart close to You, so that I honor You with more than my lips."
      ref: Matthew 15:8
    - text: "Lord, I come to You in my need. Help me."
      ref: Matthew 15:25
    - text: "Give me Your compassion for people who have nothing to eat."
      ref: Matthew 15:32
  16:
    - text: "Jesus, You are the Christ, the Son of the living God. I believe it."
      ref: Matthew 16:16
    - text: "Help me deny myself, take up my cross and follow You."
      ref: Matthew 16:24
    - text: "Keep me from gaining the whole world and forfeiting my soul."
      ref: Matthew 16:26
  17:
    - text: "Help me listen to Jesus, Your beloved Son, in whom You are well pleased."
      ref: Matthew 17:5
    - text: "When I fall down in fear, Jesus, touch me and say, do not be afraid."
      ref: Matthew 17:7
    - text: "Lord, I have so little faith. Give me faith, even as small as a mustard seed."
      ref: Matthew 17:20
  18:
    - text: "Change me, Lord, and make me humble like a little child."
      ref: Matthew 18:3
    - text: "Jesus, we gather in Your name. Thank You that You are with us."
      ref: Matthew 18:20
    - text: "Help me show mercy to others, just as You have shown mercy to me."
      ref: Matthew 18:33
  19:
    - text: "Help me never hinder children from coming to You, for the kingdom belongs to such as these."
      ref: Matthew 19:14
    - text: "Help me honor my father and mother, and love my neighbor as myself."
      ref: Matthew 19:19
    - text: "When a thing seems impossible to me, remind me that with You all things are possible."
      ref: Matthew 19:26
  20:
    - text: "Keep me from envy when You are generous to someone else."
      ref: Matthew 20:15
    - text: "Thank You, Jesus, that You came to serve and to give Your life as a ransom for many."
      ref: Matthew 20:28
    - text: "Lord, have mercy on me. I will keep crying out, even when others tell me to be quiet."
      ref: Matthew 20:31
  21:
    - text: "Hosanna to Jesus! Blessed is He who comes in the Lord's name."
      ref: Matthew 21:9
    - text: "Let Your house be a house of prayer, and let me come to pray there."
      ref: Matthew 21:13
    - text: "Thank You that You have ordained praise from the mouths of children and infants."
      ref: Matthew 21:16
  22:
    - text: "Help me give to God what belongs to God."
      ref: Matthew 22:21
    - text: "Teach me to love You, Lord my God, with all my heart, soul and mind."
      ref: Matthew 22:37
    - text: "Help me love my neighbor as myself."
      ref: Matthew 22:39
  23:
    - text: "Keep me from exalting myself. Help me humble myself before You."
      ref: Matthew 23:12
    - text: "Teach me the weightier matters of the law: justice, mercy and faithfulness."
      ref: Matthew 23:23
    - text: "Jesus, You have longed to gather Your people as a hen gathers her chicks. Keep me willing."
      ref: Matthew 23:37
  24:
    - text: "Help me to persevere to the end, for the one who perseveres will be saved."
      ref: Matthew 24:13
    - text: "Thank You, Jesus, that Your words will never pass away."
      ref: Matthew 24:35
    - text: "Keep me watching and ready, for I do not know the day my Lord will come."
      ref: Matthew 24:42
  25:
    - text: "Make me faithful with the few things You have given me."
      ref: Matthew 25:21
    - text: "Help me to feed the hungry, give drink to the thirsty and take in the stranger."
      ref: Matthew 25:35
    - text: "Let me remember that what I do for the least of these, I do for You."
      ref: Matthew 25:40
  26:
    - text: "Thank You, Jesus, that Your blood was poured out for many for the forgiveness of sins."
      ref: Matthew 26:28
    - text: "Father, when I do not want Your way, help me pray: not as I will, but as You will."
      ref: Matthew 26:39
    - text: "Help me watch and pray, so that I do not enter into temptation. My body is weak."
      ref: Matthew 26:41
  27:
    - text: "Jesus, You cried out, asking why God had forsaken You. Keep me from ever taking Your cross lightly."
      ref: Matthew 27:46
    - text: "Lord, like the centurion at the cross, I say it: truly You are the Son of God."
      ref: Matthew 27:54
  28:
    - text: "Thank You that Jesus has risen, just as He said."
      ref: Matthew 28:6
    - text: "Help me go and make disciples, for You have all authority in heaven and on earth."
      ref: Matthew 28:18-19
    - text: "Thank You that You are with me always, even to the end of the age."
      ref: Matthew 28:20
