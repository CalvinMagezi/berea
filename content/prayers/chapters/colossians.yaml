book: Colossians
reviewed: false
chapters:
  1:
    - text: "Thank You for rescuing us from the dominion of darkness and bringing us into the kingdom of Your beloved Son."
      ref: Colossians 1:13
    - text: "Thank You that Christ is before all things, and that in Him all things hold together."
      ref: Colossians 1:17
    - text: "Thank You that Christ is in me, the hope of glory."
      ref: Colossians 1:27
  2:
    - text: "Thank You that in Christ are hidden all the treasures of wisdom and knowledge."
      ref: Colossians 2:3
    - text: "Having received Christ Jesus as Lord, help me walk in Him, rooted, built up and overflowing with thankfulness."
      ref: Colossians 2:6-7
    - text: "Thank You that You made us alive with Christ and forgave us all our trespasses."
      ref: Colossians 2:13
  3:
    - text: "Help me set my mind on things above, not on earthly things."
      ref: Colossians 3:2
    - text: "Clothe me with a heart of compassion, kindness, humility, gentleness and patience."
      ref: Colossians 3:12
    - text: "Let the peace of Christ rule in my heart, and make me thankful."
      ref: Colossians 3:15
  4:
    - text: "Help me devote myself to prayer, watchful and thankful."
      ref: Colossians 4:2
    - text: "Let my speech always be gracious, seasoned with salt, so that I know how to answer everyone."
      ref: Colossians 4:6
    - text: "Help me wrestle in prayer for others, that they may stand mature and fully assured in Your will."
      ref: Colossians 4:12
