book: Psalms
reviewed: false
chapters:
  51:
    - text: "Wash me clean from the wrong I have done, and cleanse me from my sin."
      ref: Psalm 51:2
    - text: "Give me back the joy of Your salvation, and sustain me with a willing spirit."
      ref: Psalm 51:12
    - text: "I bring You a broken and humble heart, God, and You will not despise it."
      ref: Psalm 51:17
  52:
    - text: "Thank You, God, that Your loving devotion endures all day long."
      ref: Psalm 52:1
    - text: "Keep me like an olive tree flourishing in Your house, trusting in Your loving devotion forever and ever."
      ref: Psalm 52:8
    - text: "I will praise You forever for what You have done. I will wait on Your name, for it is good."
      ref: Psalm 52:9
  53:
    - text: "You look down from heaven to see who seeks You, God. Let me be one who seeks You."
      ref: Psalm 53:2
    - text: "All have turned away, and I too have turned away. I confess it to You, Lord."
      ref: Psalm 53:3
    - text: "When You restore Your captive people, God, let them rejoice and be glad."
      ref: Psalm 53:6
  54:
    - text: "Hear my prayer today, God, and listen to the words of my mouth."
      ref: Psalm 54:2
    - text: "You are my helper, God. You are the one who sustains my soul."
      ref: Psalm 54:4
    - text: "I will freely bring You my thanks and praise Your name, Lord, for it is good."
      ref: Psalm 54:6
  55:
    - text: "I call to You, God, and I trust You to save me."
      ref: Psalm 55:16
    - text: "Morning, noon and night I cry out to You in distress, and You hear my voice."
      ref: Psalm 55:17
    - text: "I cast my burden on You, Lord. Sustain me, for You never let the righteous be shaken."
      ref: Psalm 55:22
  56:
    - text: "I praise Your word, God, and I trust You. I will not be afraid."
      ref: Psalm 56:4
    - text: "You have counted my wanderings. Put my tears in Your bottle, Lord, for You keep them in Your book."
      ref: Psalm 56:8
    - text: "Thank You for keeping my feet from stumbling. Let me walk before You in the light of life."
      ref: Psalm 56:13
  57:
    - text: "Have mercy on me, God. I take shelter in the shadow of Your wings until the danger passes."
      ref: Psalm 57:1
    - text: "Keep my heart steadfast, God, and I will sing and make music to You."
      ref: Psalm 57:7
    - text: "Thank You, Lord, that Your loving devotion reaches the heavens and Your faithfulness the clouds."
      ref: Psalm 57:10
  58:
    - text: "Help me to speak justly and judge uprightly. Teach those who rule to do the same."
      ref: Psalm 58:1
    - text: "Thank You that the righteous have a reward, and that You are a God who judges the earth."
      ref: Psalm 58:11
  59:
    - text: "Lord, I keep watch for You, my strength. You, God, are my fortress."
      ref: Psalm 59:9
    - text: "My God of loving devotion, come to meet me today."
      ref: Psalm 59:10
    - text: "In the morning I will sing of Your strength. You are my refuge in times of trouble."
      ref: Psalm 59:16
  60:
    - text: "We are broken, God. Restore us."
      ref: Psalm 60:1
    - text: "Heal what is broken in our land, Lord, for it is shaking."
      ref: Psalm 60:2
    - text: "Be with us, God, and we will act with courage."
      ref: Psalm 60:12
  61:
    - text: "Whenever my heart is faint, lead me to the rock that is higher than I."
      ref: Psalm 61:2
    - text: "Let me dwell with You forever and take refuge in the shelter of Your wings."
      ref: Psalm 61:4
    - text: "I will sing praise to Your name always and keep my promises to You day by day."
      ref: Psalm 61:8
  62:
    - text: "My soul finds rest in You alone, God. My salvation comes from You."
      ref: Psalm 62:1
    - text: "Help us trust You at all times and pour out our hearts before You, for You are our refuge."
      ref: Psalm 62:8
    - text: "If my riches increase, Lord, do not let me set my heart on them."
      ref: Psalm 62:10
  63:
    - text: "God, You are my God. I seek You earnestly, and my soul thirsts for You."
      ref: Psalm 63:1
    - text: "Your loving devotion is better than life, so my lips will glorify You."
      ref: Psalm 63:3
    - text: "My soul clings to You, Lord. Hold me up with Your right hand."
      ref: Psalm 63:8
  64:
    - text: "Hear my complaint, God, and preserve my life from dread."
      ref: Psalm 64:1
    - text: "Hide me, Lord, from the schemes of the wicked."
      ref: Psalm 64:2
    - text: "Let me rejoice in You, Lord, and take refuge in You, with all the upright in heart."
      ref: Psalm 64:10
  65:
    - text: "You listen to prayer, Lord. I come to You now."
      ref: Psalm 65:2
    - text: "When my sins weigh on me, thank You that You atone for our wrongs."
      ref: Psalm 65:3
    - text: "Thank You for watering the earth and preparing our grain."
      ref: Psalm 65:9
  66:
    - text: "Let me sing the glory of Your name and make my praise glorious."
      ref: Psalm 66:2
    - text: "Thank You for preserving our lives and keeping our feet from slipping."
      ref: Psalm 66:9
    - text: "Thank You, God, for hearing me and attending to the sound of my prayer."
      ref: Psalm 66:19
  67:
    - text: "Be gracious to us, God, and bless us. Make Your face shine upon us."
      ref: Psalm 67:1
    - text: "Let Your ways be known on earth and Your salvation among all nations."
      ref: Psalm 67:2
    - text: "Thank You for the harvest the earth has yielded. You, our God, bless us."
      ref: Psalm 67:6
  68:
    - text: "Thank You, God, that You are a father to the fatherless and a defender of widows."
      ref: Psalm 68:5
    - text: "God, You settle the lonely in families. Do this for those who are alone today."
      ref: Psalm 68:6
    - text: "Lord, You bear our burden daily. Thank You, God of our salvation."
      ref: Psalm 68:19
  69:
    - text: "God, save me. The waters have risen to my neck."
      ref: Psalm 69:1
    - text: "Answer me, Lord, for Your loving devotion is good. Turn to me in Your great compassion."
      ref: Psalm 69:16
    - text: "I will praise Your name in song, God, and exalt You with thanksgiving."
      ref: Psalm 69:30
  70:
    - text: "God, hurry to deliver me. Lord, make haste to help me."
      ref: Psalm 70:1
    - text: "Let all who seek You rejoice and be glad in You, Lord."
      ref: Psalm 70:4
    - text: "I am poor and needy. You are my help and my deliverer, Lord, so do not delay."
      ref: Psalm 70:5
  71:
    - text: "I have taken refuge in You, Lord. Do not let me ever be put to shame."
      ref: Psalm 71:1
    - text: "I will always hope in You, and I will praise You more and more."
      ref: Psalm 71:14
    - text: "When I am old and gray, do not forsake me, God, until I tell the next generation of Your power."
      ref: Psalm 71:18
  72:
    - text: "Give those who lead us Your justice, God, and Your righteousness."
      ref: Psalm 72:1
    - text: "Let those who lead us deliver the needy who cry out and the afflicted who have no helper."
      ref: Psalm 72:12
    - text: "Blessed are You, Lord God. You alone do marvelous deeds."
      ref: Psalm 72:18
  73:
    - text: "Thank You that I am always with You and that You hold my right hand."
      ref: Psalm 73:23
    - text: "When my flesh and my heart fail, be the strength of my heart and my portion forever."
      ref: Psalm 73:26
    - text: "It is good to draw near to You, God. I make You my refuge."
      ref: Psalm 73:28
  74:
    - text: "Thank You, God, for working salvation on the earth since ancient times."
      ref: Psalm 74:12
    - text: "The day is Yours, and the night also. Thank You for setting the moon and the sun."
      ref: Psalm 74:16
    - text: "Do not let the oppressed turn back in shame. Let the poor and needy praise Your name."
      ref: Psalm 74:21
  75:
    - text: "We give thanks to You, God, for Your name is near. We declare Your wondrous works."
      ref: Psalm 75:1
    - text: "Thank You, God, that You judge fairly in the time You choose."
      ref: Psalm 75:2
    - text: "I will proclaim You forever and sing praise to You, my God."
      ref: Psalm 75:9
  76:
    - text: "Lord, You shine with light, more majestic than the mountains."
      ref: Psalm 76:4
    - text: "Thank You that You rose up to save all the lowly of the earth."
      ref: Psalm 76:9
    - text: "Help me keep every promise I have made to You, Lord my God."
      ref: Psalm 76:11
  77:
    - text: "I cry aloud to You, God. Please hear me."
      ref: Psalm 77:1
    - text: "Let me reflect on all You have done and ponder Your mighty deeds."
      ref: Psalm 77:12
    - text: "Thank You, God, that You work wonders and show Your strength among the peoples."
      ref: Psalm 77:14
  78:
    - text: "Help us tell the next generation Your praises, Your might and the wonders You have done."
      ref: Psalm 78:4
    - text: "Teach us to put our confidence in You, not forgetting Your works, and to keep Your commands."
      ref: Psalm 78:7
    - text: "Help me always to remember that You, God Most High, are my rock and my redeemer."
      ref: Psalm 78:35
  79:
    - text: "Lord, do not hold our past sins against us. Let Your compassion come quickly, for we are brought low."
      ref: Psalm 79:8
    - text: "Help us, God of our salvation, for the glory of Your name. Deliver us and atone for our sins."
      ref: Psalm 79:9
    - text: "We are Your people, the sheep of Your pasture. We will thank You forever and declare Your praise."
      ref: Psalm 79:13
  80:
    - text: "Hear us, You who lead Your people like a flock, and shine forth."
      ref: Psalm 80:1
    - text: "Restore us, God. Make Your face shine upon us, that we may be saved."
      ref: Psalm 80:3
    - text: "Revive us, Lord, and we will not turn away from You but call on Your name."
      ref: Psalm 80:18
  81:
    - text: "God our strength, I sing for joy to You and make a joyful noise."
      ref: Psalm 81:1
    - text: "Lord my God, I open my mouth wide before You. Please fill it."
      ref: Psalm 81:10
    - text: "Help me listen to You and follow Your ways, Lord."
      ref: Psalm 81:13
  82:
    - text: "Teach me to defend the weak and the fatherless and to uphold the rights of the afflicted."
      ref: Psalm 82:3
    - text: "Show me how to rescue the weak and needy from the hand of the wicked."
      ref: Psalm 82:4
    - text: "Rise up, God, and judge the earth, for all the nations are Yours."
      ref: Psalm 82:8
  83:
    - text: "God, do not be silent. Do not stay speechless or still."
      ref: Psalm 83:1
    - text: "Let all the earth know that You alone, whose name is the Lord, are Most High."
      ref: Psalm 83:18
  84:
    - text: "My soul longs for Your courts, Lord. My heart cries out for the living God."
      ref: Psalm 84:2
    - text: "One day in Your courts is better than a thousand elsewhere. I would rather be a doorkeeper in Your house."
      ref: Psalm 84:10
    - text: "Lord, how blessed is the one who trusts in You. I put my trust in You."
      ref: Psalm 84:12
  85:
    - text: "Revive us again, Lord, so that Your people may rejoice in You."
      ref: Psalm 85:6
    - text: "I will listen to what You say, Lord, for You speak peace to Your people."
      ref: Psalm 85:8
    - text: "Provide what is good for us, Lord, and let our land yield its increase."
      ref: Psalm 85:12
  86:
    - text: "Thank You that You are kind and forgiving, rich in loving devotion to all who call on You."
      ref: Psalm 86:5
    - text: "When I am in distress, Lord, I call on You, because You answer me."
      ref: Psalm 86:7
    - text: "Teach me Your way, Lord, so that I may walk in Your truth. Give me an undivided heart."
      ref: Psalm 86:11
  87:
    - text: "Thank You, Lord, that You have founded Your city on the holy mountains."
      ref: Psalm 87:1
    - text: "Lord, let all my springs of joy be found in You."
      ref: Psalm 87:7
  88:
    - text: "Lord, God of my salvation, I cry out before You day and night."
      ref: Psalm 88:1
    - text: "My eyes grow dim with grief. Lord, I call to You every day and spread out my hands to You."
      ref: Psalm 88:9
    - text: "But to You, Lord, I cry for help. Each morning my prayer comes before You."
      ref: Psalm 88:13
  89:
    - text: "I will sing of Your loving devotion forever, and proclaim Your faithfulness to all generations."
      ref: Psalm 89:1
    - text: "Thank You, Lord, that You rule the raging sea and still its waves."
      ref: Psalm 89:9
    - text: "Let me know the joyful sound and walk in the light of Your presence, Lord."
      ref: Psalm 89:15
  90:
    - text: "Thank You, Lord, that You have been our dwelling place through all generations."
      ref: Psalm 90:1
    - text: "Teach me to number my days, so that I may bring You a heart of wisdom."
      ref: Psalm 90:12
    - text: "Satisfy us each morning with Your loving devotion, so that we may sing for joy and be glad."
      ref: Psalm 90:14
  91:
    - text: "Thank You that under Your wings I find refuge, and that Your faithfulness is my shield."
      ref: Psalm 91:4
    - text: "Lord, please command Your angels to guard me in all my ways."
      ref: Psalm 91:11
    - text: "I call out to You, Lord. Answer me and be with me in trouble."
      ref: Psalm 91:15
  92:
    - text: "Let me proclaim Your loving devotion in the morning and Your faithfulness at night."
      ref: Psalm 92:2
    - text: "You have made me glad by Your deeds, Lord. I sing for joy at the works of Your hands."
      ref: Psalm 92:4
    - text: "Your works are great, Lord, and Your thoughts are deep. I praise You."
      ref: Psalm 92:5
  93:
    - text: "Thank You, Lord, that You reign. You are robed in majesty and clothed with strength."
      ref: Psalm 93:1
    - text: "Your throne was set long ago, Lord, and You are from all eternity."
      ref: Psalm 93:2
    - text: "Above the roar of the mighty waters, You on high are majestic, Lord."
      ref: Psalm 93:4
  94:
    - text: "When my foot slips, Lord, let Your loving devotion hold me up."
      ref: Psalm 94:18
    - text: "When anxiety overwhelms me, let Your comfort delight my soul."
      ref: Psalm 94:19
    - text: "Thank You, Lord, that You have been my stronghold and my rock of refuge."
      ref: Psalm 94:22
  95:
    - text: "Let us sing for joy to You, Lord, and shout to the rock of our salvation."
      ref: Psalm 95:1
    - text: "Let us worship and bow down, and kneel before You, our maker."
      ref: Psalm 95:6
    - text: "Today, if I hear Your voice, keep me from hardening my heart."
      ref: Psalm 95:7-8
  96:
    - text: "I bless Your name, Lord, and proclaim Your salvation day after day."
      ref: Psalm 96:2
    - text: "Help us declare Your glory among the nations and Your wonders among all peoples."
      ref: Psalm 96:3
    - text: "I worship You, Lord, in the splendor of Your holiness."
      ref: Psalm 96:9
  97:
    - text: "Lord, You reign, so let the earth rejoice and the distant shores be glad."
      ref: Psalm 97:1
    - text: "Teach me to hate evil, as one who loves You, and preserve my soul."
      ref: Psalm 97:10
    - text: "Thank You that light shines on the righteous and gladness on the upright in heart."
      ref: Psalm 97:11
  98:
    - text: "I sing a new song to You, Lord, for You have done wonders."
      ref: Psalm 98:1
    - text: "Thank You, Lord, that the ends of the earth have seen Your salvation."
      ref: Psalm 98:3
    - text: "Thank You that You will judge the world with righteousness and the peoples with equity."
      ref: Psalm 98:9
  99:
    - text: "Let us praise Your great and awesome name, Lord. You are holy."
      ref: Psalm 99:3
    - text: "Thank You, Lord, that You love justice and have established equity."
      ref: Psalm 99:4
    - text: "You answered those who called on Your name. I call on You now, Lord."
      ref: Psalm 99:6
  100:
    - text: "Help me serve You with gladness and come into Your presence with joyful songs."
      ref: Psalm 100:2
    - text: "I know that You, Lord, are God. You made us, and we are Your people, the sheep of Your pasture."
      ref: Psalm 100:3
    - text: "You are good, Lord. Your loving devotion endures forever, and Your faithfulness continues to all generations."
      ref: Psalm 100:5
