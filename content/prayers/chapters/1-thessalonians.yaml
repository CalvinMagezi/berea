book: 1 Thessalonians
reviewed: false
chapters:
  1:
    - text: "Give me faith that works, love that labors, and hope that endures in our Lord Jesus Christ."
      ref: 1 Thessalonians 1:3
    - text: "Keep my heart turned from idols, so that I serve You, the living and true God."
      ref: 1 Thessalonians 1:9
    - text: "Help me wait for Your Son from heaven, whom You raised from the dead, Jesus our deliverer."
      ref: 1 Thessalonians 1:10
  2:
    - text: "Examine my heart, God, and help me seek to please You and not people."
      ref: 1 Thessalonians 2:4
    - text: "Help me walk in a way worthy of You, who call me into Your own kingdom and glory."
      ref: 1 Thessalonians 2:12
    - text: "Thank You that Your word is at work in those who believe. Help me receive it as Yours."
      ref: 1 Thessalonians 2:13
  3:
    - text: "Thank You, God, for the great joy I have in Your presence over those who stand firm in the Lord."
      ref: 1 Thessalonians 3:8-9
    - text: "Lord, make us increase and overflow with love for one another and for everyone else."
      ref: 1 Thessalonians 3:12
    - text: "Establish my heart in blamelessness and holiness before You, our God and Father."
      ref: 1 Thessalonians 3:13
  4:
    - text: "Thank You that You have not called me to impurity, but to holiness."
      ref: 1 Thessalonians 4:7
    - text: "Help me aspire to live quietly, attend to my own matters, and work with my own hands."
      ref: 1 Thessalonians 4:11
    - text: "Jesus died and rose again. Thank You that You will bring with Him those who have fallen asleep in Him."
      ref: 1 Thessalonians 4:14
  5:
    - text: "Help us encourage and build one another up."
      ref: 1 Thessalonians 5:11
    - text: "Help me rejoice at all times, pray without ceasing, and give thanks in every circumstance."
      ref: 1 Thessalonians 5:16-18
    - text: "God of peace, sanctify me completely, and keep my spirit, soul and body blameless when Jesus comes."
      ref: 1 Thessalonians 5:23
