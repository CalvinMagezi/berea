book: 2 Peter
reviewed: true
chapters:
  1:
    - text: "Thank You that Your divine power has given us everything we need for life and godliness."
      ref: 2 Peter 1:3
    - text: "Help me make every effort to add goodness, knowledge and self-control to my faith."
      ref: 2 Peter 1:5-6
    - text: "Help me pay attention to the word of the prophets, like a lamp shining in a dark place."
      ref: 2 Peter 1:19
  2:
    - text: "Keep me from false teaching, and never let me deny You."
      ref: 2 Peter 2:1
    - text: "Thank You, Lord, that You know how to rescue the godly from trials. I trust You in mine."
      ref: 2 Peter 2:9
    - text: "Keep me from turning away from the holy commandment that was passed on to me."
      ref: 2 Peter 2:21
  3:
    - text: "Thank You for being patient with us, not wanting anyone to perish but everyone to come to repentance."
      ref: 2 Peter 3:9
    - text: "Keep my eyes on Your promise of a new heaven and a new earth, where righteousness dwells."
      ref: 2 Peter 3:13
    - text: "Keep me from being carried away by error, and help me grow in the grace and knowledge of Jesus."
      ref: 2 Peter 3:17-18
