book: Ephesians
reviewed: false
chapters:
  1:
    - text: "Blessed are You, Father of our Lord Jesus Christ. In Christ You have blessed us with every spiritual blessing."
      ref: Ephesians 1:3
    - text: "Thank You that in Christ we have redemption through His blood, the forgiveness of our trespasses."
      ref: Ephesians 1:7
    - text: "Enlighten the eyes of my heart, that I may know the hope of Your calling."
      ref: Ephesians 1:18
  2:
    - text: "Thank You that I am saved by grace through faith. It is not from myself; it is Your gift."
      ref: Ephesians 2:8
    - text: "I am Your workmanship, created in Christ Jesus. Lead me in the good works You prepared in advance."
      ref: Ephesians 2:10
    - text: "Thank You that Christ Himself is our peace, who has torn down the dividing wall of hostility."
      ref: Ephesians 2:14
  3:
    - text: "Thank You that through faith in Christ I may come into Your presence with boldness and confidence."
      ref: Ephesians 3:12
    - text: "Give us power to grasp how wide, long, high and deep the love of Christ is."
      ref: Ephesians 3:18-19
    - text: "You are able to do immeasurably more than all we ask or imagine, by the power at work within us."
      ref: Ephesians 3:20
  4:
    - text: "Help me speak the truth in love, and grow up in every way into Christ."
      ref: Ephesians 4:15
    - text: "When I am angry, keep me from sin, and help me not to let the sun set on my anger."
      ref: Ephesians 4:26
    - text: "Make me kind and tenderhearted, and help me forgive others just as in Christ You forgave me."
      ref: Ephesians 4:32
  5:
    - text: "Help me walk in love, just as Christ loved us and gave Himself up for us."
      ref: Ephesians 5:2
    - text: "Help me not to be foolish, but to understand what Your will is."
      ref: Ephesians 5:17
    - text: "Help me always give thanks to You, Father, for everything, in the name of our Lord Jesus Christ."
      ref: Ephesians 5:20
  6:
    - text: "Teach me to honor my father and mother."
      ref: Ephesians 6:2
    - text: "Help me take up the shield of faith, to put out all the flaming arrows of the evil one."
      ref: Ephesians 6:16
    - text: "Teach me to pray in the Spirit at all times, with every kind of prayer and petition."
      ref: Ephesians 6:18
