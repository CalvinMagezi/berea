book: Mark
reviewed: false
chapters:
  1:
    - text: "Help me to repent and believe the gospel, for the kingdom of God is near."
      ref: Mark 1:15
    - text: "Teach me to pray as Jesus did, early in the morning in a quiet place."
      ref: Mark 1:35
    - text: "Thank You, Jesus, that You were moved with compassion for the man who begged You."
      ref: Mark 1:41
  2:
    - text: "Help me bring those in need to You, as four men carried the paralytic."
      ref: Mark 2:3
    - text: "Thank You, Jesus, that You came to call sinners. I am one, and I come to You."
      ref: Mark 2:17
    - text: "Teach me to receive the Sabbath as Your gift, made for people."
      ref: Mark 2:27
  3:
    - text: "Keep my heart soft toward You, Jesus. Do not let it grow hard."
      ref: Mark 3:5
    - text: "Jesus, You appointed the twelve to be with You and to preach. Keep me close to You."
      ref: Mark 3:14
    - text: "Teach me to do the will of God, for Jesus calls those who do it His brothers and sisters."
      ref: Mark 3:35
  4:
    - text: "Help me hear Your word, receive it, and bear fruit."
      ref: Mark 4:20
    - text: "Help me pay attention to what I hear from You."
      ref: Mark 4:24
    - text: "Jesus, You told the wind and the sea to be still. Calm the storm in my life."
      ref: Mark 4:39
  5:
    - text: "Help me tell others how much the Lord has done for me, and what mercy He has shown me."
      ref: Mark 5:19
    - text: "Like the woman who pushed through the crowd to touch Your cloak, I reach for You, Jesus."
      ref: Mark 5:27
    - text: "When fear comes, Jesus, say to me: do not be afraid, just believe."
      ref: Mark 5:36
  6:
    - text: "Jesus, call me to a quiet place with You, to rest for a while."
      ref: Mark 6:31
    - text: "Jesus, You had compassion on people who were like sheep without a shepherd. Have compassion on me."
      ref: Mark 6:34
    - text: "Remind me to bring You even what little I have, as Your disciples did with five loaves and two fish."
      ref: Mark 6:38
  7:
    - text: "Cleanse my heart, Lord, for the evils that defile a person come from within."
      ref: Mark 7:23
    - text: "Open my ears to hear You, Jesus, and loose my tongue to speak plainly."
      ref: Mark 7:35
    - text: "Jesus, You have done all things well. I praise You."
      ref: Mark 7:37
  8:
    - text: "Jesus, where I see only dimly, touch me again until I see clearly."
      ref: Mark 8:25
    - text: "Teach me what it means to come after You, Jesus, to deny myself and take up my cross."
      ref: Mark 8:34
    - text: "Keep me from being ashamed of You and Your words, Jesus."
      ref: Mark 8:38
  9:
    - text: "Jesus, I believe. Help me where I still doubt."
      ref: Mark 9:24
    - text: "Make me a servant of all, Lord, and not one who must be first."
      ref: Mark 9:35
    - text: "Help us to have salt among ourselves, and to be at peace with one another."
      ref: Mark 9:50
  10:
    - text: "Help me receive the kingdom of God like a little child."
      ref: Mark 10:15
    - text: "Show me the one thing I lack, Jesus, and help me come and follow You."
      ref: Mark 10:21
    - text: "Jesus, You ask what I want You to do for me. Let me answer You honestly."
      ref: Mark 10:51
  11:
    - text: "Let Your house be a house of prayer for all the nations."
      ref: Mark 11:17
    - text: "Help me to have faith in God, as Jesus told His disciples."
      ref: Mark 11:22
    - text: "When I stand to pray, show me what I hold against anyone, and help me forgive."
      ref: Mark 11:25
  12:
    - text: "Help me know the Bible and the power of God, so that I am not mistaken."
      ref: Mark 12:24
    - text: "Help me love You, Lord my God, with all my heart, soul, mind and strength."
      ref: Mark 12:30
    - text: "Teach me to give with a whole heart, as the poor widow did."
      ref: Mark 12:44
  13:
    - text: "Let the gospel be proclaimed to every nation, Lord, and use my life to help."
      ref: Mark 13:10
    - text: "When I must answer for You and do not know what to say, let the Holy Spirit speak through me."
      ref: Mark 13:11
    - text: "Keep me on guard and alert, for I do not know when the appointed time will come."
      ref: Mark 13:33
  14:
    - text: "Help me do what I can for You, Jesus, as the woman who anointed You did what she could."
      ref: Mark 14:8
    - text: "Thank You, Jesus, that Your blood of the covenant was poured out for many."
      ref: Mark 14:24
    - text: "Father, all things are possible for You. Help me say, not what I will, but what You will."
      ref: Mark 14:36
  15:
    - text: "Jesus, You let out a loud cry and breathed Your last. I bow in silence before You."
      ref: Mark 15:37
    - text: "Truly this man was the Son of God. Let that be what I see when I look at the cross."
      ref: Mark 15:39
    - text: "Make me one who waits for the kingdom of God, and give me boldness for Jesus."
      ref: Mark 15:43
  16:
    - text: "Thank You, Lord, that the tomb is empty and Jesus has risen."
      ref: Mark 16:6
    - text: "Forgive my unbelief and hardness of heart, Jesus, and help me believe."
      ref: Mark 16:14
    - text: "Help me preach the gospel to everyone, as Jesus told His disciples."
      ref: Mark 16:15
