book: Proverbs
reviewed: false
chapters:
  1:
    - text: "Teach me to fear You, Lord, for that is where knowledge begins."
      ref: Proverbs 1:7
    - text: "Help me listen to my father's instruction and not forsake my mother's teaching."
      ref: Proverbs 1:8
    - text: "When others try to entice me into sin, help me not to give in to them."
      ref: Proverbs 1:10
  2:
    - text: "Teach me to seek wisdom like silver and search for it like hidden treasure."
      ref: Proverbs 2:4
    - text: "Lord, You give wisdom. Let knowledge and understanding come to me from Your mouth."
      ref: Proverbs 2:6
    - text: "You are a shield to those who walk with integrity. Help me walk that way."
      ref: Proverbs 2:7
  3:
    - text: "Help me trust You with all my heart and not lean on my own understanding."
      ref: Proverbs 3:5
    - text: "Help me acknowledge You in all my ways, and make my paths straight."
      ref: Proverbs 3:6
    - text: "Help me not to hold back good from those who deserve it when I am able to give."
      ref: Proverbs 3:27
  4:
    - text: "Help me prize wisdom above all, and gain understanding in everything I acquire."
      ref: Proverbs 4:7
    - text: "Help me guard my heart with great care, because my life flows from it."
      ref: Proverbs 4:23
    - text: "Take deception out of my mouth, and keep my lips from crooked speech."
      ref: Proverbs 4:24
  5:
    - text: "Help me keep discretion, and let my lips preserve knowledge."
      ref: Proverbs 5:2
    - text: "Help me listen to my teachers and mentors, and not turn my ear away."
      ref: Proverbs 5:13
    - text: "Lord, all my ways are before Your eyes. Help me walk as one who knows You see."
      ref: Proverbs 5:21
  6:
    - text: "Teach me to watch the ways of the ant and become wise."
      ref: Proverbs 6:6
    - text: "Keep haughty eyes and a lying tongue far from me."
      ref: Proverbs 6:17
    - text: "Make Your teaching a lamp and a light for me, and correction a way to life."
      ref: Proverbs 6:23
  7:
    - text: "Help me keep Your words and treasure Your commands deep within me."
      ref: Proverbs 7:1
    - text: "Write Your words on my heart and keep them close at hand."
      ref: Proverbs 7:3
    - text: "Keep my heart from turning aside to tempting ways, and keep me from straying into them."
      ref: Proverbs 7:25
  8:
    - text: "Help me value instruction above silver and knowledge above fine gold."
      ref: Proverbs 8:10
    - text: "Teach me to fear You, which means to hate evil, arrogant pride and perverse speech."
      ref: Proverbs 8:13
    - text: "Help me listen to instruction and become wise, and never ignore it."
      ref: Proverbs 8:33
  9:
    - text: "Help me leave foolishness behind and walk in the way of understanding."
      ref: Proverbs 9:6
    - text: "Keep me teachable, so that I grow wiser every time I am instructed."
      ref: Proverbs 9:9
    - text: "Teach me to know the Holy One, for that is where understanding comes from."
      ref: Proverbs 9:10
  10:
    - text: "Make my hands diligent in my work, and keep me from idleness."
      ref: Proverbs 10:4
    - text: "Fill me with love that covers wrongs, and keep hatred from stirring up trouble through me."
      ref: Proverbs 10:12
    - text: "Help me restrain my lips and not talk so much that I end up sinning."
      ref: Proverbs 10:19
  11:
    - text: "Help me be honest in buying and selling, because honest weights please You."
      ref: Proverbs 11:1
    - text: "Make me trustworthy, a person who keeps a confidence and does not gossip."
      ref: Proverbs 11:13
    - text: "Let me be a generous person who refreshes others."
      ref: Proverbs 11:25
  12:
    - text: "Teach me to love discipline and not to hate correction."
      ref: Proverbs 12:1
    - text: "Keep me from rash words that pierce, and give me a tongue that brings healing."
      ref: Proverbs 12:18
    - text: "When anxiety weighs on my heart, cheer me with a good word, and help me give one."
      ref: Proverbs 12:25
  13:
    - text: "Help me guard my mouth and think before I open my lips."
      ref: Proverbs 13:3
    - text: "When my hope is delayed and my heart grows sick, Lord, comfort me."
      ref: Proverbs 13:12
    - text: "Lead me to walk with wise people, so that I become wise."
      ref: Proverbs 13:20
  14:
    - text: "Keep me from any way that seems right to me but ends in death."
      ref: Proverbs 14:12
    - text: "Keep me from despising anyone, and help me show kindness to the poor."
      ref: Proverbs 14:21
    - text: "Make me patient, and keep my temper from leading me into foolishness."
      ref: Proverbs 14:29
  15:
    - text: "Give me a gentle answer when anger rises, so that wrath is turned away."
      ref: Proverbs 15:1
    - text: "Help me value a little with the fear of You above great treasure with turmoil."
      ref: Proverbs 15:16
    - text: "Help me seek counsel before I make plans, and listen to those who advise me."
      ref: Proverbs 15:22
  16:
    - text: "I commit my work to You, Lord, and I trust my plans to You."
      ref: Proverbs 16:3
    - text: "I make my plans, Lord, but You direct my steps. Guide me."
      ref: Proverbs 16:9
    - text: "Make me slow to anger and able to control my temper."
      ref: Proverbs 16:32
  17:
    - text: "Help me cover an offense with love and not bring it up to separate friends."
      ref: Proverbs 17:9
    - text: "Make me a friend who loves at all times, especially in hard days."
      ref: Proverbs 17:17
    - text: "Give me a joyful heart, and lift me when my spirit is broken."
      ref: Proverbs 17:22
  18:
    - text: "Your name is a strong tower, Lord. I run to You for safety."
      ref: Proverbs 18:10
    - text: "Help me listen to the whole matter before I answer."
      ref: Proverbs 18:13
    - text: "Lord, my tongue has the power of life and death. Help me use it to give life."
      ref: Proverbs 18:21
  19:
    - text: "Give me knowledge to go with my zeal, and keep me from rushing and missing the mark."
      ref: Proverbs 19:2
    - text: "Give me insight and patience, and help me overlook an offense."
      ref: Proverbs 19:11
    - text: "Help me be kind to the poor, for kindness to them is a loan to You."
      ref: Proverbs 19:17
  20:
    - text: "Help me to be a person who walks with integrity."
      ref: Proverbs 20:7
    - text: "I cannot say I have kept my heart pure. Cleanse me from my sin, Lord."
      ref: Proverbs 20:9
    - text: "When I am wronged, keep me from taking revenge. Help me wait on You, Lord, to save me."
      ref: Proverbs 20:22
  21:
    - text: "Help me do what is right and just, which You desire more than sacrifice."
      ref: Proverbs 21:3
    - text: "Keep me from shutting my ears to the cry of the poor."
      ref: Proverbs 21:13
    - text: "Help me pursue righteousness and loving devotion all my days."
      ref: Proverbs 21:21
  22:
    - text: "Help me value a good name above great riches."
      ref: Proverbs 22:1
    - text: "Lord, You made both the rich and the poor. Help me never to look down on anyone."
      ref: Proverbs 22:2
    - text: "Make me ready to share my bread with the poor."
      ref: Proverbs 22:9
  23:
    - text: "Keep me from wearing myself out to get rich, and give me wisdom to restrain myself."
      ref: Proverbs 23:4
    - text: "Keep my heart from envying those who sin, and keep me in the fear of You always."
      ref: Proverbs 23:17
    - text: "Help me hold on to truth, wisdom, instruction and understanding, and never sell them."
      ref: Proverbs 23:23
  24:
    - text: "Lord, build my household by wisdom and establish it by understanding."
      ref: Proverbs 24:3
    - text: "Give me courage to rescue those who are being led away to death."
      ref: Proverbs 24:11
    - text: "Even if I fall seven times, lift me up and help me to rise again."
      ref: Proverbs 24:16
  25:
    - text: "Help me speak words that fit the moment, like apples of gold in settings of silver."
      ref: Proverbs 25:11
    - text: "Give me the patience that can persuade a ruler, and a gentle tongue."
      ref: Proverbs 25:15
    - text: "Help me control my temper, so that I am not like a city with broken walls."
      ref: Proverbs 25:28
  26:
    - text: "Keep me from being wise in my own eyes, and keep me ready to be taught."
      ref: Proverbs 26:12
    - text: "Keep me from deceiving anyone and then saying I was only joking."
      ref: Proverbs 26:19
    - text: "Help me not to feed gossip, so that conflict may cease."
      ref: Proverbs 26:20
  27:
    - text: "Keep me from boasting about tomorrow, for I do not know what a day may bring."
      ref: Proverbs 27:1
    - text: "As iron sharpens iron, use me to sharpen others, and let others sharpen me."
      ref: Proverbs 27:17
    - text: "Help me know the state of all You have put in my care, and watch over it closely."
      ref: Proverbs 27:23
  28:
    - text: "Keep me from hiding my sins. I confess them and turn from them; have mercy on me."
      ref: Proverbs 28:13
    - text: "Keep me from trusting in myself, and help me walk in wisdom."
      ref: Proverbs 28:26
    - text: "Help me give to the poor and never hide my eyes from their need."
      ref: Proverbs 28:27
  29:
    - text: "Help me hold back my anger instead of pouring it all out."
      ref: Proverbs 29:11
    - text: "Give us vision, Lord, so that we do not cast off restraint, and help us keep Your law."
      ref: Proverbs 29:18
    - text: "Free me from the fear of people, and help me trust in You, Lord."
      ref: Proverbs 29:25
  30:
    - text: "Every word of Yours is flawless. Thank You for being a shield to all who take refuge in You."
      ref: Proverbs 30:5
    - text: "Keep lies far from me. Give me neither poverty nor riches. Feed me with the bread I need."
      ref: Proverbs 30:8
    - text: "Let me not have so much that I deny You, nor so little that I steal and dishonor Your name."
      ref: Proverbs 30:9
  31:
    - text: "Help me to open my mouth for those who have no voice."
      ref: Proverbs 31:8
    - text: "Let me speak with wisdom, and let faithful instruction be on my tongue."
      ref: Proverbs 31:26
    - text: "Teach me to fear You rather than trust in charm or beauty, which do not last."
      ref: Proverbs 31:30
