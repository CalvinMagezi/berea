id: paul-7
title: The prayers of Paul
summary: "7 days · Ephesians, Philippians, Colossians"
fasting: false
reviewed: true
days:
  - title: Know God better
    ref: Ephesians 1:17-19
    points:
      - text: "Glorious Father, give me a spirit of wisdom and revelation, that I may know You."
        ref: Ephesians 1:17
      - text: "Light up the eyes of my heart, so that I know the hope of Your calling."
        ref: Ephesians 1:18
      - text: "Show me the surpassing greatness of Your power toward us who believe."
        ref: Ephesians 1:19
  - title: Christ in your heart
    ref: Ephesians 3:14-19
    points:
      - text: "Out of the riches of Your glory, strengthen me with power by Your Spirit in my inner being."
        ref: Ephesians 3:16
      - text: "Let Christ make His home in my heart through faith, and let love be my root and foundation."
        ref: Ephesians 3:17
      - text: "Help me know the love of Christ, which is beyond knowing, and be filled with Your fullness."
        ref: Ephesians 3:19
  - title: Glory to God
    ref: Ephesians 3:20-21
    points:
      - text: "Lord, You can do immeasurably more than all I ask or imagine. I bring my needs to You."
        ref: Ephesians 3:20
      - text: "Thank You that Your power is at work within us."
        ref: Ephesians 3:20
      - text: "Glory to You in the church and in Christ Jesus, in every generation, forever. Amen."
        ref: Ephesians 3:21
  - title: Love that grows
    ref: Philippians 1:9-11
    points:
      - text: "Let my love overflow more and more, with knowledge and deep insight."
        ref: Philippians 1:9
      - text: "Help me test what is best, and be pure and blameless for the day of Christ."
        ref: Philippians 1:10
      - text: "Fill me with the fruit of righteousness that comes through Jesus Christ, to Your glory and praise."
        ref: Philippians 1:11
  - title: Know God's will
    ref: Colossians 1:9-10
    points:
      - text: "Help me know what You want of me, with all spiritual wisdom and understanding."
        ref: Colossians 1:9
      - text: "Help me walk worthy of You, Lord, and please You in every way."
        ref: Colossians 1:10
      - text: "Let me bear fruit in every good work and grow in knowing You."
        ref: Colossians 1:10
  - title: Strength, joy and thanks
    ref: Colossians 1:11-12
    points:
      - text: "Strengthen me with all power, according to Your glorious might."
        ref: Colossians 1:11
      - text: "Give me full endurance and patience, and fill me with joy."
        ref: Colossians 1:11
      - text: "Thank You, Father, that You have qualified me to share in the inheritance of Your people in the light."
        ref: Colossians 1:12
  - title: A door for the word
    ref: Colossians 4:2-4
    points:
      - text: "Help me to devote myself to prayer, and to stay watchful and thankful."
        ref: Colossians 4:2
      - text: "Open a door for Your word, so that I may proclaim the mystery of Christ."
        ref: Colossians 4:3
      - text: "Help me to speak of Christ clearly, as I should."
        ref: Colossians 4:4
