id: work-7
title: 7 days for your work
summary: "Work, a job, a business · 3 prayer points a day"
fasting: true
reviewed: false
days:
  - title: Give your work to the Lord
    ref: Proverbs 16:3
    points:
      - text: "Lord, I hand all my work over to You, the big tasks and the small."
        ref: Proverbs 16:3
      - text: "My ways seem pure to me, but You weigh my motives. Show me what is in my heart."
        ref: Proverbs 16:2
      - text: "I plan my course in my heart, but You decide my steps. I trust You with them."
        ref: Proverbs 16:9
  - title: Ask for daily bread
    ref: Matthew 6:11
    points:
      - text: "Father, give us what we need for today."
        ref: Matthew 6:11
      - text: "Thank You, Father, that You know what I need before I ask."
        ref: Matthew 6:8
      - text: "Help me seek Your kingdom and Your righteousness first, and trust You to add the rest."
        ref: Matthew 6:33
  - title: Ask for wisdom
    ref: James 1:5
    points:
      - text: "Give me wisdom for the choices in front of me this week."
        ref: James 1:5
      - text: "I commit my plans to You. Make them firm."
        ref: Proverbs 16:3
      - text: "When I ask You, help me to ask in faith, without doubting."
        ref: James 1:6
  - title: Work with your whole heart
    ref: Colossians 3:23
    points:
      - text: "Whatever I am given to do today, help me work at it with my whole being, as for You."
        ref: Colossians 3:23
      - text: "Give me a sincere heart in my work, even when no one is watching me."
        ref: Colossians 3:22
      - text: "It is the Lord Christ I am serving. Help me to remember it when work is hard."
        ref: Colossians 3:24
  - title: Be honest in every deal
    ref: Proverbs 11:1
    points:
      - text: "Lord, an accurate weight is Your delight. Help me measure fairly in every sale and every deal."
        ref: Proverbs 11:1
      - text: "Let my integrity guide me, and keep me from crooked ways."
        ref: Proverbs 11:3
      - text: "Keep my lips from lying. Help me deal faithfully, for that is Your delight."
        ref: Proverbs 12:22
  - title: Learn to be content
    ref: Philippians 4:11-12
    points:
      - text: "Teach me to be content, whatever my circumstances."
        ref: Philippians 4:11
      - text: "Teach me the secret of living humbly and of having plenty, in any and every situation."
        ref: Philippians 4:12
      - text: "Thank You, Christ, for the strength You give me for whatever I face."
        ref: Philippians 4:13
  - title: Give thanks for the work of your hands
    ref: Psalm 90:17
    points:
      - text: "Thank You for the gift of eating, drinking and finding satisfaction in all my labor."
        ref: Ecclesiastes 3:13
      - text: "Here is the work of my hands, with thanks. Let Your favor rest on it, and make it firm."
        ref: Psalm 90:17
      - text: "Satisfy me in the morning with Your loving devotion, so I may sing for joy all my days."
        ref: Psalm 90:14
