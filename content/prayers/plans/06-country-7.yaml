id: country-7
title: For our country and its leaders
summary: "7 days · 1 Timothy 2:1-2"
fasting: false
reviewed: false
days:
  - title: Pray for everyone
    ref: 1 Timothy 2:1
    points:
      - text: "Make me faithful to bring petitions, prayers and thanks to You for everyone."
        ref: 1 Timothy 2:1
      - text: "God our Savior, it pleases You when we pray for everyone. Help me to do it."
        ref: 1 Timothy 2:3
      - text: "You want everyone to be saved and to know the truth. I ask this for our leaders too."
        ref: 1 Timothy 2:4
  - title: Pray for our leaders
    ref: 1 Timothy 2:2
    points:
      - text: "Lord, I lift up our leaders and all who hold authority over us."
        ref: 1 Timothy 2:2
      - text: "Help us to lead quiet and peaceful lives, in all godliness and dignity."
        ref: 1 Timothy 2:2
      - text: "I give thanks to You for those who lead us, as I do for everyone."
        ref: 1 Timothy 2:1
  - title: Authority comes from God
    ref: Romans 13:1
    points:
      - text: "Help me to submit to the governing authorities, for all authority comes from You."
        ref: Romans 13:1
      - text: "Remind our leaders, Lord, that no authority exists except what comes from You."
        ref: Romans 13:1
      - text: "Let those in authority be Your servants for our good."
        ref: Romans 13:4
  - title: Seek the good of your city
    ref: Jeremiah 29:7
    points:
      - text: "Show me how to seek the prosperity of the place where You have sent me."
        ref: Jeremiah 29:7
      - text: "Lord, I pray on behalf of our city. Let it prosper."
        ref: Jeremiah 29:7
      - text: "Help me to remember that my city's good is my good too."
        ref: Jeremiah 29:7
  - title: When the righteous flourish
    ref: Proverbs 29:2
    points:
      - text: "Let the righteous flourish among us, Lord, so that the people rejoice."
        ref: Proverbs 29:2
      - text: "Teach our leaders to rule with justice, which brings stability to the land."
        ref: Proverbs 29:4
      - text: "Help our leaders, and help me, to consider the cause of the poor."
        ref: Proverbs 29:7
  - title: Righteousness lifts a nation
    ref: Proverbs 14:34
    points:
      - text: "Let righteousness lift up our nation, Lord, and let it begin with me."
        ref: Proverbs 14:34
      - text: "Forgive us, Lord, for the sin that is a disgrace to any people."
        ref: Proverbs 14:34
      - text: "Make me kind to the needy, for kindness to them honors You."
        ref: Proverbs 14:31
  - title: Blessed is the nation
    ref: Psalm 33:12
    points:
      - text: "Lord, we ask that our nation will have You as its God. Blessed is such a nation."
        ref: Psalm 33:12
      - text: "Teach our leaders, and all of us, to trust You and not our own strength."
        ref: Psalm 33:16
      - text: "Lord, as we put our hope in You, let Your loving devotion rest on us."
        ref: Psalm 33:22
